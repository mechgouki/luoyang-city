</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1164 tb1164" x="80" y="85.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>文献关系附图<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1165 tb1165" x="80" y="178.0" font-family="Noto Sans CJK SC,sans-serif" font-size="62" font-weight="700" text-anchor="start" fill="#263f3b">附图<tspan font-family="DejaVu Sans"> D </tspan>·<tspan font-family="DejaVu Sans"> </tspan>北邙与崇立寺<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>保留未定位信息</text><text class="wt1166 tb1166" x="80" y="250.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#917452">独立关系图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与总图距离或拼接<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>箭头表示文献关系</text><line x1="80" y1="283" x2="3520" y2="283" stroke="#d5d8cf" stroke-width="2"/><rect x="80" y="320" width="3440" height="2110" rx="0" fill="#fbf8ef" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(150 350) scale(1.1)"><text class="wt1167 tb1167" x="150" y="90.0" font-family="Noto Sans CJK SC,sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">独立未定位附图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与全城距离；不以卷次代替寺院地址</text><path d="M178 235 L150 235 L150 785 L178 785" stroke="#917452" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1168 tb1168" x="172" y="282.0" font-family="Noto Sans CJK SC,sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#917452">北邙山上<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>仅知粗略地域</text><text class="wt1169 tb1169" x="172" y="323.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">“山上”可核；两寺相互方位、距城门里程与范围均未给。</text><path d="M328 415 L300 415 L300 695 L328 695" stroke="#d5d8cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1170 tb1170" x="322" y="458.0" font-family="Noto Sans CJK SC,sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">同属山域<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>组内不排空间先后</text><g class="wentry187"><text class="wt1171 tb1171" x="324.0" y="506.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T72 </tspan>冯王寺〔盛时年代未定〕〔年未定〕</text></g><g class="wentry188"><text class="wt1172 tb1172" x="1500.0" y="506.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T73 </tspan>齐献武王寺〔记名层待定〕</text></g><text class="wt1173 tb1173" x="322" y="672.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">保留寺名与时间疑点，不把两寺画成全盛期已证实的地点。</text><path d="M178 1000 L150 1000 L150 1360 L178 1360" stroke="#d5d8cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1174 tb1174" x="172" y="1043.0" font-family="Noto Sans CJK SC,sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">本书有僧籍记载<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>洛阳地址仍未给</text><g class="wentry189"><text class="wt1175 tb1175" x="174.0" y="1091.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T71 </tspan>崇立寺〔神龟元年惠生取经条〕</text></g><text class="wt1176 tb1176" x="172" y="1337.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">据本书记年为<tspan font-family="DejaVu Sans">518</tspan>年。崇立／崇灵等异文待辨；不自动等同崇虚寺，也不因记在卷五而定在城北。</text><text class="wt1177 tb1177" x="150" y="1510.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">后续续核版本、史传与地志中的地址记载，再推进寺名定位。</text><text class="wt1178 tb1178" x="150" y="1690.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">据周《校释》、范《校注》卷五宋云惠生使西域、京师建制及郭外寺院段。</text></g><text class="wt1179 tb1179" x="80" y="2495.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#707b76">局部画布<tspan font-family="DejaVu Sans">3000</tspan>×<tspan font-family="DejaVu Sans">1800</tspan>；独立索引，不以图中位置表达全城方位或距离。<tspan font-family="DejaVu Sans">  /  </tspan>冯王、齐献武王两寺只落实到北邙山域，盛时年代另行保留。<tspan font-family="DejaVu Sans">  /  </tspan>崇立寺据<tspan font-family="DejaVu Sans">518</tspan>年使西域条有名；寺址无明文，寺名异文仍待辨。</text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1180 tb1180" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">只表达有据关系；原文量距保留原单位，不折算为当前图面距离。</text><text class="wt1181 tb1181" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#707b76">附图<tspan font-family="DejaVu Sans"> D / v2.4</tspan></text></svg>