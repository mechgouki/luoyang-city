<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="292.5mm" viewBox="0 0 2800 1950" role="img"><title>北魏洛阳统一建筑群图例</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#707b76" stroke-width="1.3"/></marker></defs><rect x="0" y="0" width="2800" height="1950" fill="#faf9f5"/><text x="85" y="79.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> / v2.4 </tspan>全城统一图式</text><text x="85" y="174.0" font-family="Noto Serif CJK SC, serif" font-size="57" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Serif">L01  </tspan>统一图例：类别、关系与年代各自表达</text><text x="85" y="246.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#707b76">图符大小不表示实际占地；图符外框不是院墙；图面位置沿用<tspan font-family="DejaVu Sans"> v2.3 </tspan>绘图坐标。</text><line x1="85" y1="286" x2="2715" y2="286" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(180 472) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#356f62">寺</text></g><text x="290" y="450.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#356f62">寺院</text><text x="290" y="518.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">寺为群级标志；有据之塔、殿另用专门图符。没</text><text x="290" y="560.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">有记录时不补齐塔殿与僧房。</text><line x1="85" y1="730" x2="905" y2="730" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(1080 472) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#955d51" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#955d51" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#955d51">宫</text></g><text x="1190" y="450.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#955d51">宫城与宫苑</text><text x="1190" y="518.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">群名优先；殿、台、池、山分别判断位置。宫苑</text><text x="1190" y="560.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">不套入通用庭院模板。</text><line x1="985" y1="730" x2="1805" y2="730" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(1980 472) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#5d6d78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#5d6d78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#5d6d78">署</text></g><text x="2090" y="450.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#5d6d78">官署</text><text x="2090" y="518.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">官名与沿路关系优先。不用网格暗示柱网、开间</text><text x="2090" y="560.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">或等宽院落。</text><line x1="1885" y1="730" x2="2705" y2="730" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(180 902) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#917452" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#917452" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#917452">宅</text></g><text x="290" y="880.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#917452">宅第</text><text x="290" y="948.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">按目标时层使用宅名。楼、堂、园有记述时，再</text><text x="290" y="990.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">列构成与方位。</text><line x1="85" y1="1160" x2="905" y2="1160" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(1080 902) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#9b7b3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#9b7b3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#9b7b3d">市</text></g><text x="1190" y="880.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#9b7b3d">市场与里</text><text x="1190" y="948.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">市场使用市标志；里名组成开放名录。行业是附</text><text x="1190" y="990.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">注，不是排他分区。</text><line x1="985" y1="1160" x2="1805" y2="1160" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(1980 902) scale(1.1)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#7f776d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#7f776d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#7f776d">坛</text></g><text x="2090" y="880.0" font-family="Noto Serif CJK SC, serif" font-size="41" font-weight="500" text-anchor="start" fill="#7f776d">礼制与学校</text><text x="2090" y="948.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">坛、庙、学以文字分型。仅有功能名称时，不推</text><text x="2090" y="990.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">导坛形或院落。</text><line x1="1885" y1="1160" x2="2705" y2="1160" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1305.0" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#263f3b">地理与关系</text><line x1="105" y1="1394" x2="350" y2="1394" stroke="#d4c8ae" stroke-width="22"/><line x1="105" y1="1394" x2="350" y2="1394" stroke="#ffffff" stroke-width="17"/><text x="390" y="1404.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">道路带：通行关系；宽度与路形示意</text><line x1="105" y1="1480" x2="350" y2="1480" stroke="#e0edf0" stroke-width="26"/><line x1="105" y1="1480" x2="350" y2="1480" stroke="#6f99a5" stroke-width="2" stroke-dasharray="12 8"/><text x="390" y="1490.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">浅蓝：水系；河岸形状仍属示意</text><path d="M1050 1360 L1030 1360 L1030 1505 L1050 1505" fill="none" stroke="#707b76" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="1080" y="1412.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">开放括线：名物所属或名录</text><text x="1080" y="1472.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">没有方位、距离或道路含义</text><text x="1850" y="1408.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">文字短注：年代与解释条件</text><text x="1850" y="1470.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">如“后改寺”“始造有记，竣工未证”</text><line x1="85" y1="1570" x2="2715" y2="1570" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1640.0" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">全城</text><text x="85" y="1702.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#263f3b">类型、群名、城市骨架</text><text x="985" y="1640.0" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#5d6d78">街区</text><text x="985" y="1702.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#263f3b">有据方位、所属、道路衔接</text><text x="1885" y="1640.0" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#9b7b3d">详图</text><text x="1885" y="1702.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#263f3b">内部关系与非定位构成旁注</text><line x1="85" y1="1833" x2="2715" y2="1833" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">配色仅用于类别；不得将他图的粗细、空心或填色自动解释为本图的证据等级。</text><text x="2715" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">L01 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>统一图式</text></svg>