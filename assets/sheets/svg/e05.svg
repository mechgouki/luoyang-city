</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt134 tb134" x="80" y="83.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>全城统一图式<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt135 tb135" x="80" y="179.0" font-family="Noto Sans CJK SC,sans-serif" font-size="65" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">E05  </tspan>图外关系与未定位置</text><text class="wt136 tb136" x="80" y="252.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">这些条目已从地理画面移出；本页排版不产生方向、距离或相邻关系。</text><line x1="80" y1="285" x2="3520" y2="285" stroke="#d5d8cf" stroke-width="2"/><line x1="85" y1="360" x2="1745" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt137 tb137" x="85" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">城东附记<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不作定点</text><text class="wt138 tb138" x="85" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P151 </tspan>张景仁宅：市北＋孝义里〔待协调〕</text><text class="wt139 tb139" x="85" y="544.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P190 </tspan>昭义里：仅知城东〔勿并昭德〕</text><text class="wt140 tb140" x="85" y="612.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">张宅前居城南归正里。此框只列约束，不表示两项相邻。</text><text class="wt141 tb141" x="85" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt142 tb142" x="85" y="730.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">张景仁宅的市北、孝义里约束待协调；昭义里仅粗知城东，二者不因同框而相邻。</text><text class="wt143 tb143" x="85" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0132a10</tspan>；<tspan font-family="DejaVu Sans">0133a01</tspan>；<tspan font-family="DejaVu Sans">CBETA B12n0077 p0170a04</tspan></text><line x1="1845" y1="360" x2="3505" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt144 tb144" x="1845" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">灵台上附记<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>造塔年代未记</text><text class="wt145 tb145" x="1845" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P159 </tspan>汝南王砖浮图〔台上〕</text><text class="wt146 tb146" x="1845" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">只标同址关系；不画<tspan font-family="DejaVu Sans">528</tspan>年前已成塔。</text><text class="wt147 tb147" x="1845" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt148 tb148" x="1845" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">只知塔在灵台上，年代未记；台址可留在图中，塔记述与定年说明置旁注。</text><text class="wt149 tb149" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0077 p0150a08</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt150 tb150" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">大觉寺以东<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>寺址未细定</text><text class="wt151 tb151" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T65 </tspan>永明寺</text><text class="wt152 tb152" x="85" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">与融觉的先后、路侧未记</text><text class="wt153 tb153" x="85" y="1724.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt154 tb154" x="85" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">永明在大觉东、宜年在永明西可保留；当前卡在城西阊阖御道北，会多出未记路侧，改用关系附记。</text><text class="wt155 tb155" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0205a0101</tspan></text><line x1="1845" y1="1450" x2="3505" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt156 tb156" x="1845" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">宜年—永明<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>东西关系</text><text class="wt157 tb157" x="1845" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P229 </tspan>宜年里</text><text class="wt158 tb158" x="1845" y="1634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T65 </tspan>永明寺</text><text class="wt159 tb159" x="1845" y="1702.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">宜年里在永明寺西；永明在大觉寺东。只保留方向关系，不据此确定道路侧别或间距。</text><text class="wt160 tb160" x="1845" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt161 tb161" x="1845" y="1820.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">永明唯一地图表示已移至旁注，本关系随其转入旁注，保留宜年在永明西，避免在旧卡位置留下无指向对象的箭头。</text><text class="wt162 tb162" x="1845" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0208a0101</tspan>；<tspan font-family="DejaVu Sans">pB12p0205a0101</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt163 tb163" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt164 tb164" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E05 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>