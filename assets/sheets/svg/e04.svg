</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1285 tb1285" x="80" y="83.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>全城统一图式<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1286 tb1286" x="80" y="179.0" font-family="Noto Sans CJK SC,sans-serif" font-size="65" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">E04  </tspan>图外关系与未定位置</text><text class="wt1287 tb1287" x="80" y="252.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">这些条目已从地理画面移出；本页排版不产生方向、距离或相邻关系。</text><line x1="80" y1="285" x2="3520" y2="285" stroke="#d5d8cf" stroke-width="2"/><line x1="85" y1="360" x2="1745" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1288 tb1288" x="85" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">归正里附见<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>内部无定位</text><text class="wt1289 tb1289" x="85" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#9b7b3d"><tspan font-family="DejaVu Sans">P181 </tspan>鱼鳖市〔里内巷市〕</text><text class="wt1290 tb1290" x="85" y="544.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P194 </tspan>萧宝夤归正里旧宅</text><text class="wt1291 tb1291" x="85" y="612.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">宝夤后迁城内永安里；宅、市内部关系未记。</text><text class="wt1292 tb1292" x="85" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1293 tb1293" x="85" y="730.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">与<tspan font-family="DejaVu Sans"> S06 </tspan>一致：只知鱼鳖市、旧宅属归正里，不将名单框的洛南偏南位置当作址点。</text><text class="wt1294 tb1294" x="85" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0077 p0132a12</tspan>–<tspan font-family="DejaVu Sans">15</tspan>；<tspan font-family="DejaVu Sans">B12n0077 p0161a04</tspan>–<tspan font-family="DejaVu Sans">05</tspan>；<tspan font-family="DejaVu Sans">p0161a06</tspan>–<tspan font-family="DejaVu Sans">07</tspan></text><line x1="1845" y1="360" x2="3505" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1295 tb1295" x="1845" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">道东二坊<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>位置次序未明</text><text class="wt1296 tb1296" x="1845" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P182 </tspan>白象坊〔太后时代叙事〕</text><text class="wt1297 tb1297" x="1845" y="544.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P183 </tspan>狮子坊〔盛时时相未证〕</text><text class="wt1298 tb1298" x="1845" y="612.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">狮子入京约<tspan font-family="DejaVu Sans">530</tspan>前后；盛时不复原其盛况。</text><text class="wt1299 tb1299" x="1845" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1300 tb1300" x="1845" y="730.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">道东仍有据，但两坊内部次序与盛时时相不齐；采用图外年代说明，文字保留道东。</text><text class="wt1301 tb1301" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0163a04</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1302 tb1302" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">洛水南<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>市场关系</text><text class="wt1303 tb1303" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#9b7b3d"><tspan font-family="DejaVu Sans">P180 </tspan>四通市〔又称永桥市〕</text><text class="wt1304 tb1304" x="85" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">御道路侧、距桥距离与鱼鳖市关系未定。</text><text class="wt1305 tb1305" x="85" y="1724.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1306 tb1306" x="85" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">与<tspan font-family="DejaVu Sans"> S06 </tspan>一致：只知洛水南，原框在御道东；必须去掉原框位置的地理含义。</text><text class="wt1307 tb1307" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0162a15</tspan></text><line x1="1845" y1="1450" x2="3505" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1308 tb1308" x="1845" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">跨区附记<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>太尉府前旧塔</text><text class="wt1309 tb1309" x="1845" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P114 </tspan>砖浮图〔赵逸谈旧〕</text><text class="wt1310 tb1310" x="1845" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">问答未交代府址；不据城东篇落点，不与宫前太尉同址。前向未定。</text><text class="wt1311 tb1311" x="1845" y="1724.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1312 tb1312" x="1845" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">问答未交代府址，不按卷二城东篇落点，也不径与宫前太尉府合址。</text><text class="wt1313 tb1313" x="1845" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0110a09</tspan>–<tspan font-family="DejaVu Sans">10</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1314 tb1314" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt1315 tb1315" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E04 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>