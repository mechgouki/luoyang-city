font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">两项均不另给精确院址</text><text class="wt1234 tb1234" x="1845" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1235 tb1235" x="1845" y="730.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">治粟里参照待定，绿珠楼是晋旧址；混合名录不成为两处相邻北魏地点。</text><text class="wt1236 tb1236" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0078_p0394a07-08</tspan>；<tspan font-family="DejaVu Sans">B12n0078_p0395a03</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1237 tb1237" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">钓台殿†<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>所在台／山有异解</text><text class="wt1238 tb1238" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#955d51"><tspan font-family="DejaVu Sans">P81 </tspan>华林园钓台殿〔不定点〕</text><text class="wt1239 tb1239" x="85" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">周补〔台〕，释在九华台上；范存上／山异文</text><text class="wt1240 tb1240" x="85" y="1724.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1241 tb1241" x="85" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">已校为台／山异解；须保持不定点，不能再贴到蓬莱山或九华台。</text><text class="wt1242 tb1242" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0078_p0405a15-0406a01</tspan></text><line x1="1845" y1="1450" x2="3505" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1243 tb1243" x="1845" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">王南寺<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>承明通行关联</text><text class="wt1244 tb1244" x="1845" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T86 </tspan>王南寺〔城西，回指待辨〕</text><text class="wt1245 tb1245" x="1845" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">高祖往寺论义而通承明；寺址、路侧未记。</text><text class="wt1246 tb1245" x="1845" y="1691.8" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">此框仅记通行叙事，不定位寺址。</text><text class="wt1247 tb1247" x="1845" y="1762.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1248 tb1248" x="1845" y="1810.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">通承明是往寺的通行叙事；寺址及路侧未记，不将图框解释为承明门西北的寺院。</text><text class="wt1249 tb1249" x="1845" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0037a0401</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1250 tb1250" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt1251 tb1251" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E02 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>