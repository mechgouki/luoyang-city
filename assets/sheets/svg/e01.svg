</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1182 tb1182" x="80" y="83.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>全城统一图式<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1183 tb1183" x="80" y="179.0" font-family="Noto Sans CJK SC,sans-serif" font-size="65" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">E01  </tspan>图外关系与未定位置</text><text class="wt1184 tb1184" x="80" y="252.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">这些条目已从地理画面移出；本页排版不产生方向、距离或相邻关系。</text><line x1="80" y1="285" x2="3520" y2="285" stroke="#d5d8cf" stroke-width="2"/><line x1="85" y1="360" x2="1745" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1185 tb1185" x="85" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">洛阳小城<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非定位附记</text><text class="wt1186 tb1186" x="85" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P44 </tspan>金墉东〔补句回指候选〕</text><text class="wt1187 tb1187" x="85" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">范围未定；此卡位置无地理意义</text><text class="wt1188 tb1188" x="85" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1189 tb1189" x="85" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">原卡明言位置无地理意义；金墉东只是补句回指候选，须保留为替代解释。</text><text class="wt1190 tb1190" x="85" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0078_p0387a06-07</tspan></text><line x1="1845" y1="360" x2="3505" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1191 tb1191" x="1845" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">柰林—都堂<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>未定位置关系组</text><text class="wt1192 tb1192" x="1845" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">P93 </tspan>柰林〔全局位置未定〕</text><text class="wt1193 tb1193" x="1845" y="544.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P94 </tspan>林南：苗茨碑</text><text class="wt1194 tb1194" x="1845" y="592.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#955d51"><tspan font-family="DejaVu Sans">P95 </tspan>碑北：苗茨堂</text><text class="wt1195 tb1195" x="1845" y="640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#955d51"><tspan font-family="DejaVu Sans">P96 </tspan>林西：都堂</text><text class="wt1196 tb1196" x="1845" y="688.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P97 </tspan>流觞池〔与都堂相关〕</text><text class="wt1197 tb1197" x="1845" y="736.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P98 </tspan>堂东：扶桑海</text><text class="wt1198 tb1198" x="1845" y="804.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">局部方向依上述明文；其余相互位置、间距与全局位置未定。</text><text class="wt1199 tb1199" x="1845" y="874.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1200 tb1200" x="1845" y="922.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">全局位置未定；把柰林、碑、堂和两池画在千秋路附近会添加原文没有的全局位置。局部南北、东西关系仍写入附图。</text><text class="wt1201 tb1201" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0078_p0406a11; p0407a02</tspan>；<tspan font-family="DejaVu Sans">B12n0078_p0406a11-12</tspan>；<tspan font-family="DejaVu Sans">B12n0078_p0406a12</tspan>；<tspan font-family="DejaVu Sans">B12n0078_p0407a02</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1202 tb1202" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">永宁以南<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>胡统寺</text><text class="wt1203 tb1203" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T07 </tspan>胡统寺</text><text class="wt1204 tb1204" x="85" y="1654.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">寺南一里许；御道路侧未定</text><text class="wt1205 tb1205" x="85" y="1724.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1206 tb1206" x="85" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">只知永宁寺南一里许；当前卡在御道西。迁到旁注保留南向和原里程，避免确定路侧。</text><text class="wt1207 tb1207" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0078_p0399a01</tspan></text><line x1="1845" y1="1450" x2="3505" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1208 tb1208" x="1845" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">宫前官署<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>替代记载</text><text class="wt1209 tb1209" x="1845" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#5d6d78"><tspan font-family="DejaVu Sans">P19 </tspan>《河南志》太府寺</text><text class="wt1210 tb1210" x="1845" y="1634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#5d6d78"><tspan font-family="DejaVu Sans">P18 </tspan>《河南志》司州</text><text class="wt1211 tb1211" x="1845" y="1702.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">文本替代、补充层；不另画确定院址</text><text class="wt1212 tb1212" x="1845" y="1772.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1213 tb1213" x="1845" y="1820.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">太府寺、司州属于替代或补充文献层，不是宫前另两处确定院址。</text><text class="wt1214 tb1214" x="1845" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：河南志网页<tspan font-family="DejaVu Sans">1317-1319</tspan>；河南志网页<tspan font-family="DejaVu Sans">1315-1325</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1215 tb1215" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt1216 tb1216" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E01 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>