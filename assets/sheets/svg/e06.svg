<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="315mm" viewBox="0 0 3600 2700"><defs>
<marker id="relarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8c958b" stroke-width="1.5"/></marker>
<pattern id="hatch" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M0 38L38 0" stroke="#b1b79d" stroke-width="1" opacity=".35"/></pattern>
<pattern id="reserved" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28L28 0" stroke="#b79a63" stroke-width="1" opacity=".32"/></pattern>
</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1347 tb1347" x="80" y="83.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>全城统一图式<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1348 tb1348" x="80" y="179.0" font-family="Noto Sans CJK SC,sans-serif" font-size="65" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">E06  </tspan>图外关系与未定位置</text><text class="wt1349 tb1349" x="80" y="252.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">这些条目已从地理画面移出；本页排版不产生方向、距离或相邻关系。</text><line x1="80" y1="285" x2="3520" y2="285" stroke="#d5d8cf" stroke-width="2"/><line x1="85" y1="360" x2="1745" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1350 tb1350" x="85" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">旧宅东<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>路侧未定</text><text class="wt1351 tb1351" x="85" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T57 </tspan>王典御寺</text><text class="wt1352 tb1352" x="85" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">只据“宣忠寺东”</text><text class="wt1353 tb1353" x="85" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1354 tb1354" x="85" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">仅知宣忠寺东，当前卡在御道南附近；改旁注，保留东向关系，不据此确定同纬或路侧。</text><text class="wt1355 tb1355" x="85" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0181a0801</tspan></text><line x1="1845" y1="360" x2="3505" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1356 tb1356" x="1845" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">寺前关联</text><text class="wt1357 tb1357" x="1845" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P236 </tspan>阅武场</text><text class="wt1358 tb1358" x="1845" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">“前”的绝对方向未记</text><text class="wt1359 tb1359" x="1845" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1360 tb1360" x="1845" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">阅武场在寺前，但前不等于正南；图外附记仍保留与禅虚寺的关联。</text><text class="wt1361 tb1361" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0213a0501</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1362 tb1362" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">附记<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>方位未定（非此处地块）</text><text class="wt1363 tb1363" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P215 </tspan>阜财／准财里</text><text class="wt1364 tb1364" x="85" y="1634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P216 </tspan>金肆里</text><text class="wt1365 tb1365" x="85" y="1682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T61 </tspan>开善寺〔阜财里内〕〔年未定〕</text><text class="wt1366 tb1366" x="85" y="1750.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">周作阜财，范存准财；全局方位未记。</text><text class="wt1367 tb1366" x="85" y="1787.8" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">开善在里内；齐谐为改名，不增画一里。</text><text class="wt1368 tb1368" x="85" y="1858.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1369 tb1369" x="85" y="1906.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">阜财／准财、金肆全局方位未记，开善只知里属；原卡位置明言不作地块。</text><text class="wt1370 tb1370" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">pB12p0193a0201</tspan>；<tspan font-family="DejaVu Sans">pB12p0193a0901</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1371 tb1371" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt1372 tb1372" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E06 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>