<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="315mm" viewBox="0 0 3600 2700"><defs>
<marker id="relarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8c958b" stroke-width="1.5"/></marker>
<pattern id="hatch" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M0 38L38 0" stroke="#b1b79d" stroke-width="1" opacity=".35"/></pattern>
<pattern id="reserved" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28L28 0" stroke="#b79a63" stroke-width="1" opacity=".32"/></pattern>
</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1252 tb1252" x="80" y="83.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>全城统一图式<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1253 tb1253" x="80" y="179.0" font-family="Noto Sans CJK SC,sans-serif" font-size="65" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">E03  </tspan>图外关系与未定位置</text><text class="wt1254 tb1254" x="80" y="252.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">这些条目已从地理画面移出；本页排版不产生方向、距离或相邻关系。</text><line x1="80" y1="285" x2="3520" y2="285" stroke="#d5d8cf" stroke-width="2"/><line x1="85" y1="360" x2="1745" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1255 tb1255" x="85" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">景兴<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>桥南沿道附记</text><text class="wt1256 tb1256" x="85" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T25 </tspan>景兴尼寺〔年未定〕</text><text class="wt1257 tb1257" x="85" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">道侧未定；本框为非定位附记。</text><text class="wt1258 tb1258" x="85" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1259 tb1259" x="85" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">原卡明确非定位，桥南沿道关系不确定道东／道西。</text><text class="wt1260 tb1260" x="85" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0107a11</tspan></text><line x1="1845" y1="360" x2="3505" y2="360" stroke="#d5d8cf" stroke-width="2"/><text class="wt1261 tb1261" x="1845" y="425.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">招福寺<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>施主关联，寺址未定</text><text class="wt1262 tb1262" x="1845" y="496.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T40 </tspan>招福寺</text><text class="wt1263 tb1263" x="1845" y="564.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">高氏造寺；没有明文证明就在其宅址。</text><text class="wt1264 tb1264" x="1845" y="634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1265 tb1265" x="1845" y="682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">高氏造寺不等于寺就在其宅；当前卡南偏位置不能替代寺址证据。</text><text class="wt1266 tb1266" x="1845" y="1340.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0148a12</tspan>；<tspan font-family="DejaVu Sans">0149a01</tspan></text><line x1="85" y1="1450" x2="1745" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1267 tb1267" x="85" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">报德参照群<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>路侧未记</text><text class="wt1268 tb1268" x="85" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T43 </tspan>报德寺〔参照〕</text><text class="wt1269 tb1269" x="85" y="1634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T49 </tspan>其东：龙华寺〔城南〕〔年未定〕</text><text class="wt1270 tb1270" x="85" y="1682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T50 </tspan>其东：追圣寺〔年未定〕</text><text class="wt1271 tb1271" x="85" y="1750.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">开阳门外三里；不因本框排版推成道东。</text><text class="wt1272 tb1272" x="85" y="1820.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1273 tb1273" x="85" y="1868.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">报德在门外三里但路侧未记；龙华、追圣的其东关系须留在非定位关系附注。</text><text class="wt1274 tb1274" x="85" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">CBETA B12n0077 p0151a13</tspan>–<tspan font-family="DejaVu Sans">15</tspan>；<tspan font-family="DejaVu Sans">CBETA B12n0077 p0158a01</tspan>–<tspan font-family="DejaVu Sans">03</tspan></text><line x1="1845" y1="1450" x2="3505" y2="1450" stroke="#d5d8cf" stroke-width="2"/><text class="wt1275 tb1275" x="1845" y="1515.0" font-family="Noto Sans CJK SC,sans-serif" font-size="39" font-weight="500" text-anchor="start" fill="#356f62">里内寺院<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>时相未明</text><text class="wt1276 tb1276" x="1845" y="1586.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T51 </tspan>归正寺〔萧正德宅改〕〔年未定〕</text><text class="wt1277 tb1277" x="1845" y="1634.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#356f62"><tspan font-family="DejaVu Sans">T52 </tspan>菩提寺〔慕义里〕〔年未定〕</text><text class="wt1278 tb1278" x="1845" y="1682.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">P193 </tspan>萧正德宅〔归正里〕</text><text class="wt1279 tb1279" x="1845" y="1750.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">归正寺属归正里；菩提寺属慕义里。</text><text class="wt1280 tb1280" x="1845" y="1820.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="500" text-anchor="start" fill="#5d6d78">表示限制</text><text class="wt1281 tb1281" x="1845" y="1868.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">与<tspan font-family="DejaVu Sans"> S06 </tspan>新样板一致：归正寺、菩提寺分别归属不同里，当前名单上下行无地理意义；另保留改寺和年代。</text><text class="wt1282 tb1282" x="1845" y="2430.0" font-family="Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#707b76">出处：<tspan font-family="DejaVu Sans">B12n0077 p0161a07</tspan>–<tspan font-family="DejaVu Sans">09</tspan>；<tspan font-family="DejaVu Sans">CBETA B12n0077 p0165a02</tspan></text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1283 tb1283" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">原始记录与方位约束完整保留；本轮只撤去没有证据支持的页面落点含义。</text><text class="wt1284 tb1284" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">E03 / v2.4 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>非地理附图</text></svg>