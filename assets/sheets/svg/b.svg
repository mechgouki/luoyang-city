</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1107 tb1107" x="80" y="85.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>文献关系附图<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1108 tb1108" x="80" y="178.0" font-family="Noto Sans CJK SC,sans-serif" font-size="62" font-weight="700" text-anchor="start" fill="#263f3b">附图<tspan font-family="DejaVu Sans"> B </tspan>·<tspan font-family="DejaVu Sans"> </tspan>长分桥—千金堰<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>区位与水工叙事</text><text class="wt1109 tb1109" x="80" y="250.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#917452">独立关系图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与总图距离或拼接<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>箭头表示文献关系</text><line x1="80" y1="283" x2="3520" y2="283" stroke="#d5d8cf" stroke-width="2"/><rect x="80" y="320" width="3440" height="2110" rx="0" fill="#fbf8ef" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(150 350) scale(1.1)"><text class="wt1110 tb1110" x="150" y="90.0" font-family="Noto Sans CJK SC,sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">独立关系附图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与全城距离；东西次序只依本段明记关系</text><text class="wt1111 tb1111" x="150" y="165.0" font-family="Noto Sans CJK SC,sans-serif" font-size="40" font-weight="400" text-anchor="start" fill="#356f62" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">桥堰区位</text><g class="wnode179"><path d="M464.72 321 L458 321 L458 389 L464.72 389" stroke="#263f3b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M522 321 L542 321 L542 389 L522 389" stroke="#263f3b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1112 tb1112" x="500" y="369.0" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="500" text-anchor="middle" fill="#263f3b">地</text><text class="wt1113 tb1113" x="500" y="432.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><tspan font-family="DejaVu Sans">P234 </tspan>千金堰</text><text class="wt1114 tb1114" x="500" y="475.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">堰长、形制及距桥里程未记</text></g><g class="wnode180"><rect x="1477" y="305" width="46" height="100" rx="0" fill="#ffffff" stroke="#263f3b" stroke-width="3"/><line x1="1477" y1="315" x2="1523" y2="315" stroke="#263f3b" stroke-width="1.4"/><line x1="1477" y1="330" x2="1523" y2="330" stroke="#263f3b" stroke-width="1.4"/><line x1="1477" y1="345" x2="1523" y2="345" stroke="#263f3b" stroke-width="1.4"/><line x1="1477" y1="360" x2="1523" y2="360" stroke="#263f3b" stroke-width="1.4"/><line x1="1477" y1="375" x2="1523" y2="375" stroke="#263f3b" stroke-width="1.4"/><line x1="1477" y1="390" x2="1523" y2="390" stroke="#263f3b" stroke-width="1.4"/><text class="wt1115 tb1115" x="1500" y="432.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><tspan font-family="DejaVu Sans">P232 </tspan>长分桥</text><text class="wt1116 tb1116" x="1500" y="475.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">图示符号不表示桥式或朝向</text></g><g class="wnode181"><path d="M2464.72 321 L2458 321 L2458 389 L2464.72 389" stroke="#263f3b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2522 321 L2542 321 L2542 389 L2522 389" stroke="#263f3b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1117 tb1117" x="2500" y="369.0" font-family="Noto Sans CJK SC,sans-serif" font-size="38" font-weight="500" text-anchor="middle" fill="#263f3b">地</text><text class="wt1118 tb1118" x="2500" y="432.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><tspan font-family="DejaVu Sans">P198 </tspan>阊阖门〔城西门〕</text><text class="wt1119 tb1119" x="2500" y="475.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">引用门名；不接入母图坐标</text></g><path d="M1290 265 L710 265" stroke="#90988b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relarr)"/><text class="wt1120 tb1120" x="800" y="230.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">桥西<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>距离未记</text><path d="M2310 265 L1690 265" stroke="#90988b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relarr)"/><text class="wt1121 tb1121" x="1730" y="230.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">门外七里〔原文单位〕</text><path d="M928 535 L900 535 L900 780 L928 780" stroke="#d5d8cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1122 tb1122" x="922" y="578.0" font-family="Noto Sans CJK SC,sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">桥名与汉旧迹附记</text><g class="wentry182"><text class="wt1123 tb1123" x="924.0" y="626.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P233 </tspan>夕阳亭〔汉旧迹〕</text></g><text class="wt1124 tb1124" x="922" y="757.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">同书称张方桥为汉夕阳亭旧迹；不增画一座北魏亭。</text><text class="wt1125 tb1125" x="150" y="840.0" font-family="Noto Sans CJK SC,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">长分／张方／张夫人：桥名来源有两说，作者未决；不拆成三座桥。</text><path d="M178 915 L150 915 L150 1565 L178 1565" stroke="#917452" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1126 tb1126" x="172" y="962.0" font-family="Noto Sans CJK SC,sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#917452">中朝水工追叙<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>只示文本关系</text><text class="wt1127 tb1127" x="172" y="1003.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">以下水线是独立叙事符号；不是北魏河道图。</text><path d="M300 1220 L650 1220" stroke="#e0edf0" stroke-width="70" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 1220 L650 1220" stroke="#6f99a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15 10"/><text class="wt1128 tb1128" x="405" y="1165.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#6f99a5" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">谷水</text><path d="M1138 1100 L1110 1100 L1110 1400 L1138 1400" stroke="#d5d8cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1129 tb1129" x="1132" y="1143.0" font-family="Noto Sans CJK SC,sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">石桥限水</text><g class="wentry183"><text class="wt1130 tb1130" x="1134.0" y="1191.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Sans">P232 </tspan>长分桥命名一说</text></g><text class="wt1131 tb1131" x="1132" y="1377.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">原文水涨分流入洛；具体结构未记。</text><path d="M705 1220 L1070 1220" stroke="#90988b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relarr)"/><text class="wt1132 tb1132" x="720" y="1170.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">注城下<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>立桥限水</text><path d="M1930 1220 L2380 1220" stroke="#90988b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relarr)"/><text class="wt1133 tb1133" x="2010" y="1170.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">分流入洛</text><path d="M2440 1220 L2750 1220" stroke="#e0edf0" stroke-width="70" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M2440 1220 L2750 1220" stroke="#6f99a5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15 10"/><text class="wt1134 tb1134" x="2530" y="1165.0" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#6f99a5" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">洛水</text><text class="wt1135 tb1135" x="215" y="1490.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#6f99a5" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">河道全程、入洛点及千金堰与各支流的连接，均不据此定线。</text><text class="wt1136 tb1136" x="150" y="1680.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">据周祖谟《校释》、范祥雍《校注》卷四长分桥、千金堰及夕阳亭记述。</text></g><text class="wt1137 tb1137" x="80" y="2495.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#707b76">局部画布<tspan font-family="DejaVu Sans">3000</tspan>×<tspan font-family="DejaVu Sans">1800</tspan>；完全独立于母图，不参与全城距离。<tspan font-family="DejaVu Sans">  /  </tspan>长分桥在西阊阖门外七里；千金堰只知在桥西，原文未记距桥里程。<tspan font-family="DejaVu Sans">  /  </tspan>下半为中朝水工追叙，箭头不代表北魏河道，桥名异说与汉旧迹分别说明。</text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1138 tb1138" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">只表达有据关系；原文量距保留原单位，不折算为当前图面距离。</text><text class="wt1139 tb1139" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#707b76">附图<tspan font-family="DejaVu Sans"> B / v2.4</tspan></text></svg>