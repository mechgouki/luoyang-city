</defs><rect x="0" y="0" width="3600" height="2700" rx="0" fill="#faf9f5"/><text class="wt1140 tb1140" x="80" y="85.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>文献关系附图<tspan font-family="DejaVu Sans"> v2.4</tspan></text><text class="wt1141 tb1141" x="80" y="178.0" font-family="Noto Sans CJK SC,sans-serif" font-size="62" font-weight="700" text-anchor="start" fill="#263f3b">附图<tspan font-family="DejaVu Sans"> C </tspan>·<tspan font-family="DejaVu Sans"> </tspan>河间王琛宅<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>文柏堂与迎风馆</text><text class="wt1142 tb1142" x="80" y="250.0" font-family="Noto Sans CJK SC,sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#917452">独立关系图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与总图距离或拼接<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>箭头表示文献关系</text><line x1="80" y1="283" x2="3520" y2="283" stroke="#d5d8cf" stroke-width="2"/><rect x="80" y="320" width="3440" height="2110" rx="0" fill="#fbf8ef" stroke="#d5d8cf" stroke-width="2"/><g transform="translate(150 350) scale(1.1)"><text class="wt1143 tb1143" x="150" y="90.0" font-family="Noto Sans CJK SC,sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">独立从属关系图<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>不参与全城距离；横向排版没有东西方位含义</text><path d="M178 250 L150 250 L150 1330 L178 1330" stroke="#917452" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1144 tb1144" x="172" y="297.0" font-family="Noto Sans CJK SC,sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#917452">河间王琛宅<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>盛时名称</text><text class="wt1145 tb1145" x="172" y="338.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">此框只表达构件属于同一宅第叙述，不表示宅院边界。</text><g class="wnode184"><rect x="714" y="626" width="92" height="48" rx="0" fill="#ffffff" stroke="#5d6d78" stroke-width="2.7"/><line x1="708" y1="620" x2="812" y2="620" stroke="#5d6d78" stroke-width="1.8"/><line x1="708" y1="680" x2="812" y2="680" stroke="#5d6d78" stroke-width="1.8"/><text class="wt1146 tb1146" x="760" y="727.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#5d6d78" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><tspan font-family="DejaVu Sans">P227 </tspan>文柏堂</text><text class="wt1147 tb1147" x="760" y="770.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">同段记为王琛所造；内址未记</text></g><text class="wt1148 tb1148" x="760" y="890.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263f3b" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">形如徽音殿</text><text class="wt1149 tb1149" x="760" y="945.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">形制比拟不能确定平面尺寸</text><text class="wt1150 tb1150" x="760" y="1030.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">文柏堂与后园的相互方位未记</text><path d="M1528 465 L1500 465 L1500 1145 L1528 1145" stroke="#356f62" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1151 tb1151" x="1522" y="512.0" font-family="Noto Sans CJK SC,sans-serif" font-size="36" font-weight="500" text-anchor="start" fill="#356f62">后园〔相对称谓〕</text><text class="wt1152 tb1152" x="1522" y="553.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">绝对朝向、范围及主轴未记。</text><g class="wnode185"><rect x="2009" y="756" width="92" height="48" rx="0" fill="#ffffff" stroke="#5d6d78" stroke-width="2.7"/><line x1="2003" y1="750" x2="2107" y2="750" stroke="#5d6d78" stroke-width="1.8"/><line x1="2003" y1="810" x2="2107" y2="810" stroke="#5d6d78" stroke-width="1.8"/><text class="wt1153 tb1153" x="2055" y="857.0" font-family="Noto Sans CJK SC,sans-serif" font-size="31" font-weight="500" text-anchor="middle" fill="#5d6d78" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round"><tspan font-family="DejaVu Sans">P228 </tspan>迎风馆</text><text class="wt1154 tb1154" x="2055" y="900.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">明确建于后园；不把“后”换成正北</text></g><text class="wt1155 tb1155" x="2055" y="1030.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#356f62" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">仅表达“馆在园内”的包含关系</text><text class="wt1156 tb1156" x="1500" y="1250.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">井、池、回廊与两建筑的相对位置未据此定位</text><path d="M178 1435 L150 1435 L150 1675 L178 1675" stroke="#d5d8cf" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="wt1157 tb1157" x="172" y="1478.0" font-family="Noto Sans CJK SC,sans-serif" font-size="33" font-weight="500" text-anchor="start" fill="#356f62">后出寺名与后园描写另分时间层</text><g class="wentry186"><text class="wt1158 tb1158" x="174.0" y="1526.0" font-family="Noto Sans CJK SC,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#917452"><tspan font-family="DejaVu Sans">T67 </tspan>河间寺〔河阴事后段落〕</text></g><text class="wt1159 tb1159" x="172" y="1652.0" font-family="Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">后文所写池渠、石磴、飞梁，不据此反推盛时宅园的具体平面。</text><text class="wt1160 tb1160" x="150" y="1740.0" font-family="Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76" stroke="#faf9f5" stroke-width="6" paint-order="stroke" stroke-linejoin="round">据周《校释》、范《校注》卷四寿丘王宅及河间寺段。</text></g><text class="wt1161 tb1161" x="80" y="2495.0" font-family="Noto Sans CJK SC,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#707b76">局部画布<tspan font-family="DejaVu Sans">3000</tspan>×<tspan font-family="DejaVu Sans">1800</tspan>；只示叙事从属关系，不作为宅院平面。<tspan font-family="DejaVu Sans">  /  </tspan>文柏堂属于王宅；迎风馆在后园。“后”不等于正北，两建筑相对方位未记。<tspan font-family="DejaVu Sans">  /  </tspan>河阴之后的寺园池渠描写留在后出层，不填入盛时院落。</text><line x1="80" y1="2585" x2="3520" y2="2585" stroke="#d5d8cf" stroke-width="2"/><text class="wt1162 tb1162" x="80" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">只表达有据关系；原文量距保留原单位，不折算为当前图面距离。</text><text class="wt1163 tb1163" x="3520" y="2640.0" font-family="Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="end" fill="#707b76">附图<tspan font-family="DejaVu Sans"> C / v2.4</tspan></text></svg>