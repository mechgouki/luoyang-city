<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1430" viewBox="0 0 1920 1430" font-family="Noto Sans CJK SC,sans-serif"><title>永宁寺：底稿目标与第五次试绘偏差</title><desc>Two equally scaled original-image pixel panels compare unchanged R12 ground geometry with approximate manual observations of the rejected fifth generated image. No raster is embedded or modified. Manual ranges are not surveyed coordinates.</desc><rect x="0.00000" y="0.00000" width="1920.00000" height="1430.00000" rx="0" fill="#f7f5ee" stroke="none" stroke-width="2" opacity="1"/><text x="60.000" y="65.000" font-size="39" fill="#263d3a" font-weight="700" text-anchor="start">永宁寺：底稿目标与第五次试绘偏差</text><text x="60.000" y="106.000" font-size="24" fill="#ae3f34" font-weight="600" text-anchor="start">第五次试绘未通过空间与门楼检查；本图是几何诊断，不是新艺术全景。</text><text x="60.000" y="141.000" font-size="22" fill="#5b6b65" font-weight="400" text-anchor="start">同一原图坐标 1672 × 941 px · 两栏同一倍率 · 图像人工约读，非实测</text><rect x="50.00000" y="171.00000" width="900.00000" height="645.00000" rx="12" fill="#fffefa" stroke="#d6ded6" stroke-width="2" opacity="1"/><text x="80.000" y="212.000" font-size="29" fill="#186f69" font-weight="600" text-anchor="start">A  冻结投影几何</text><text x="80.000" y="245.000" font-size="20" fill="#5b6b65" font-weight="400" text-anchor="start">七段寺墙保留缺口；仅画塔座、佛殿框与南门基址。</text><path d="M120.00000,275.00000L120.00000,758.00000" fill="none" stroke="#d6ded6" stroke-width="0.8"/><text x="120.000" y="783.000" font-size="16" fill="#5b6b65" font-weight="400" text-anchor="middle">440</text><path d="M212.00000,275.00000L212.00000,758.00000" fill="none" stroke="#d6ded6" stroke-width="0.8"/><text x="212.000" y="783.000" font-size="16" fill="#5b6b65" font-weight="400" text-anchor="middle">460</text><path d="M304.00000,275.00000L304.00000,758.00000" fill="none" stroke="#d6ded6" stroke-width="0.8"/><text x="304.000" y="783.000" font-size="16" fill="#5b6b65" font-weight="400" text-anchor="middle">480</text><path d="M396.00000,275.00000L396.00000,7