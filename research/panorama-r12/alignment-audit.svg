ext x="865.000" y="1103.000" font-size="20" fill="#263d3a" font-weight="400" text-anchor="start">前基宽约 45–50 px；前基点约 (517,426)</text><text x="1470.000" y="1103.000" font-size="20" fill="#ae3f34" font-weight="400" text-anchor="start">宽度仍大，前缘偏前</text><path d="M80.00000,1123.00000L1840.00000,1123.00000" fill="none" stroke="#d6ded6" stroke-width="0.8"/><text x="82.000" y="1163.000" font-size="22" fill="#263d3a" font-weight="600" text-anchor="start">木塔</text><text x="275.000" y="1163.000" font-size="20" fill="#263d3a" font-weight="400" text-anchor="start">目标塔座下缘最前 y≈433.7</text><text x="865.000" y="1163.000" font-size="20" fill="#263d3a" font-weight="400" text-anchor="start">木构前缘 y≈440；基/阶前缘 y≈441–445</text><text x="1470.000" y="1163.000" font-size="20" fill="#263d3a" font-weight="400" text-anchor="start">9 层主要木构可辨；中心未定</text><text x="60.000" y="1244.000" font-size="20" fill="#5b6b65" font-weight="400" text-anchor="start">约读限制：主要点位约 ±5 px，墙段约 ±10 px；门槛/前基/台阶与目标框心口径不同，不能直接当同一点的实测位移。</text><text x="60.000" y="1277.000" font-size="20" fill="#5b6b65" font-weight="400" text-anchor="start">宽度线只按约读点居中显示区间，不补出完整门殿基址；塔完整地面中心被遮，未猜测。九层塔不抵销门楼与占地检查失败。</text><text x="60.000" y="1310.000" font-size="20" fill="#5b6b65" font-weight="400" text-anchor="start">H 未修改；局部图接入全城仍为候选绑定。y 增大仅表示画面更靠前，不是新的古代坐标或历史距离。</text><text x="60.000" y="1354.000" font-size="15" fill="#5b6b65" font-weight="400" text-anchor="start">试绘 PNG SHA256：45813547ae4555e9b60226f72adfd6df75aa0a36324a23c50966adc3092a0fa6</text><text x="60.000" y="1382.000" font-size="15" fill="#5b6b65" font-weight="400" text-anchor="start">审查 JSON SHA256：63d50a665ae7f20cc679132f6f693045fcac4c3863033283c9280ab2e4476bc3</text></svg>