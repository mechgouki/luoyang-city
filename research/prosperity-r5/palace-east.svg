<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
  <title id="title">从太极殿向东看：宫城内外的两处仓储区</title>
  <desc id="desc">上图依发掘汇报梳理东西次序。司马门内路隔开朝堂与宫内仓储，宫城东墙以东另有仓窖。下图据现场照片，所选仓窖编号、东围墙、广莫门内道路自西向东分布。两图各自独立，均无比例。</desc>
  <defs>
    <pattern id="pits" patternUnits="userSpaceOnUse" width="13" height="13">
      <path d="M-3 3L3 -3M0 13L13 0M10 16L16 10" stroke="#6f8b7a" stroke-width="1" opacity=".5"/>
    </pattern>
    <style>
      text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#243c33}
      .tit{font-family:"Noto Serif CJK SC","Songti SC",serif;font-weight:700;font-size:39px}
      .sect{font-size:23px;font-weight:700}.lab{font-size:19px;font-weight:700}.body{font-size:17px}
      .meta{font-size:15px;fill:#56655b}.rice{fill:#ead9bc}.line{stroke:#4e685a;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1000" height="860" fill="#f8f5eb"/>
  <path d="M44 36H96" stroke="#a55739" stroke-width="5"/>
  <text x="110" y="42" class="meta">北魏洛阳　/　宫城考古工作图</text>
  <text x="44" y="105" class="tit">从太极殿向东看</text>
  <text x="46" y="142" class="body">宫院、道路与两处仓储区　｜　北魏时期，具体使用年份待分辨</text>
  <path d="M44 166H956" stroke="#b6bdad"/>
  <text x="44" y="207" class="sect">宫墙内外的空间次序</text>
  <text x="956" y="207" class="meta" text-anchor="end">西在左　·　北在上　·　无比例</text>
  <rect x="44" y="230" width="912" height="242" fill="#efeee2" rx="4"/>
  <rect x="66" y="252" width="126" height="151" fill="#f9f6ec"/>
  <text x="129" y="308" text-anchor="middle" class="lab">太极殿</text>
  <text x="129" y="335" text-anchor="middle" class="body">宫院</text>
  <path d="M192 252v151" class="line"/>
  <rect x="208" y="252" width="117" height="151" class="rice"/>
  <text x="267" y="307" text-anchor="middle" class="lab">司马门</text>
  <text x="267" y="335" text-anchor="middle" class="body">内道路</text>
  <path d="M342 252v151" class="line"/>
  <rect x="345" y="252" width="267" height="74" fill="#d5e1d1"/>
  <text x="478" y="297" class="lab" text-anchor="middle">宫内 · 北部建筑区</text>
  <rect x="345" y="329" width="267" height="74" fill="url(#pits)"/>
  <path d="M345 327h267" stroke="#657d67" stroke-width="3"/>
  <text x="478" y="374" class="lab" text-anchor="middle" stroke="#efeee2" stroke-width="4" paint-order="stroke">宫内 · 南部窖穴区</text>
  <path d="M644 251v141m0 25v36" stroke="#804e38" stroke-width="7"/>
  <path d="M636 397h16m-16 6h16m-16 6h16" stroke="#804e38" stroke-width="2.4"/>
  <text x="658" y="429" class="meta">东掖门</text>
  <text x="644" y="242" text-anchor="middle" class="meta">宫城东墙</text>
  <rect x="720" y="274" width="212" height="105" fill="#efddca" stroke="#9a6a47" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="826" y="317" class="lab" text-anchor="middle">宫外 · 仓窖区</text>
  <text x="826" y="350" class="body" text-anchor="middle">候选解释为「太仓」</text>
  <text x="66" y="440" class="meta">实线标墙　／　斜纹标地下遗存　／　色块只交代分区与次序</text>
  <text x="44" y="512" class="sect">宫外仓窖东缘有哪些实物线索？</text>
  <text x="956" y="512" class="meta" text-anchor="end">独立局部图　·　据现场示意图选读</text>
  <rect x="44" y="532" width="912" height="212" fill="#e9eee3" rx="4"/>
  <g fill="#345c4a" stroke="#f6f8ed" stroke-width="2">
    <circle cx="114" cy="639" r="7"/><circle cx="202" cy="637" r="7"/><circle cx="286" cy="637" r="7"/>
    <circle cx="370" cy="637" r="7"/><circle cx="445" cy="637" r="7"/><circle cx="520" cy="638" r="7"/><circle cx="637" cy="640" r="7"/>
  </g>
  <g text-anchor="middle" class="body">
    <text x="114" y="672">P3-8</text><text x="202" y="672">P3-7</text><text x="286" y="672">P3-6</text>
    <text x="370" y="672">P3-5</text><text x="445" y="672">P3-4</text><text x="520" y="672">P3-3</text><text x="637" y="672">P3-2</text>
  </g>
  <path d="M755 550l-11 173" stroke="#9a5840" stroke-width="7"/>
  <rect x="772" y="550" width="163" height="173" class="rice"/>
  <text x="853" y="631" text-anchor="middle" class="lab">广莫门</text><text x="853" y="659" text-anchor="middle" class="body">内道路</text>
  <text x="730" y="582" text-anchor="end" class="body">东围墙</text><path d="M706 589l42 16" fill="none" stroke="#9a5840" stroke-width="1.5"/>
  <text x="76" y="569" class="meta">↑ 北</text>
  <text x="76" y="714" class="meta">圆点指原图编号的排列顺序。图上距离、窖口大小和道路宽度均不供量测。</text>
  <path d="M44 772H956" stroke="#b6bdad"/>
  <text x="44" y="805" class="body">图据　洛阳汉魏城队年度汇报、新华社现场图与《人民日报》考古队访谈。</text>
  <text x="44" y="834" class="meta">东掖门在宫城东墙，东阳门见于内城文献，广莫门内道路见于上列现场图。</text>
</svg>
