<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="292.5mm" viewBox="0 0 2800 1950" role="img"><title>洛南街区：永桥、四夷馆里与市场</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#707b76" stroke-width="1.3"/></marker></defs><rect x="0" y="0" width="2800" height="1950" fill="#faf9f5"/><text x="85" y="79.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> / v2.4 </tspan>首批应用样板</text><text x="85" y="174.0" font-family="Noto Serif CJK SC, serif" font-size="57" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Serif">S06  </tspan>洛南：永桥、四夷馆里与市场</text><text x="85" y="246.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#707b76">首版街区深化<tspan font-family="DejaVu Sans"> / 25 </tspan>条文献约束已登记<tspan font-family="DejaVu Sans"> / </tspan>主图表示道东、道西；安置与迁居关系在图外展开。</text><line x1="85" y1="286" x2="2715" y2="286" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="356.0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#5d6d78">洛南专题<tspan font-family="DejaVu Sans"> / </tspan>沿用<tspan font-family="DejaVu Sans"> R11 </tspan>母图视窗</text><rect x="85.0" y="594.3793103448277" width="1680.0" height="861.2413793103448" fill="#ffffff" stroke="#d5d8cf" stroke-width="2"/><defs><clipPath id="mapcrop"><rect x="85.0" y="594.3793103448277" width="1680.0" height="861.2413793103448"/></clipPath></defs><g clip-path="url(#mapcrop)"><g transform="translate(-1498.4482758620688 -2773.3448275862065) scale(0.38620689655172413)"><path d="M400 8970 L2300 9010 L4200 8940 L6100 9000 L8000 8970 L9800 9050 L11700 8960" fill="none" stroke="#e0edf0" stroke-width="130" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 8970 L2300 9010 L4200 8940 L6100 9000 L8000 8970 L9800 9050 L11700 8960" fill="none" stroke="#6f99a5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="20 14"/><rect x="6062" y="8860" width="76" height="280" fill="#ffffff" stroke="#5d6d78" stroke-width="4"/><line x1="6062" y1="8890" x2="6138" y2="8890" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="8945" x2="6138" y2="8945" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9000" x2="6138" y2="9000" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9055" x2="6138" y2="9055" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9110" x2="6138" y2="9110" stroke="#5d6d78" stroke-width="2"/><text x="6220" y="9010.0" font-family="Noto Sans CJK SC, sans-serif" font-size="48" font-weight="400" text-anchor="start" fill="#5d6d78">永桥<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>浮桥</text><text x="6220" y="9070.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76"><tspan font-family="DejaVu Sans">P167</tspan></text><path d="M6100 9200 L6100 10600" fill="none" stroke="#d4c8ae" stroke-width="76" stroke-linejoin="round" stroke-linecap="round"/><path d="M6100 9200 L6100 10600" fill="none" stroke="#ffffff" stroke-width="70" stroke-linejoin="round" stroke-linecap="round"/><path d="M4340 9480 L4320 9480 L4320 9880 L4340 9880" fill="none" stroke="#917452" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="4375" y="9544.0" font-family="Noto Sans CJK SC, sans-serif" font-size="57" font-weight="500" text-anchor="start" fill="#917452">御道西<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>四夷里</text><text x="4375" y="9645.0" font-family="Noto Sans CJK SC, sans-serif" font-size="51" font-weight="400" text-anchor="start" fill="#263f3b">归正里<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>归德里</text><text x="4375" y="9724.05" font-family="Noto Sans CJK SC, sans-serif" font-size="51" font-weight="400" text-anchor="start" fill="#263f3b">慕化里<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>慕义里</text><text x="4375" y="9855.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#707b76">列名无内部方位含义；不表示里界</text><path d="M6390 9390 L6370 9390 L6370 9900 L6390 9900" fill="none" stroke="#5d6d78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="6425" y="9454.0" font-family="Noto Sans CJK SC, sans-serif" font-size="57" font-weight="500" text-anchor="start" fill="#5d6d78">御道东<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>四夷馆</text><text x="6425" y="9555.0" font-family="Noto Sans CJK SC, sans-serif" font-size="51" font-weight="400" text-anchor="start" fill="#263f3b">金陵馆<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>燕然馆</text><text x="6425" y="9634.05" font-family="Noto Sans CJK SC, sans-serif" font-size="51" font-weight="400" text-anchor="start" fill="#263f3b">扶桑馆<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>崦嵫馆</text><text x="6425" y="9875.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#707b76">列名无内部方位含义；不表示里界</text><text x="6180" y="10280.0" font-family="Noto Sans CJK SC, sans-serif" font-size="55" font-weight="400" text-anchor="start" fill="#5d6d78">御道</text><text x="4950" y="10310.0" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400" text-anchor="middle" fill="#707b76">院落、坊界与街巷未明</text><text x="4950" y="10383.0" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400" text-anchor="middle" fill="#707b76">主图留白不表示当时空地</text><line x1="6100" y1="10600" x2="6100" y2="10810" stroke="#707b76" stroke-width="4" marker-end="url(#arr)"/><text x="6240" y="10730.0" font-family="Noto Sans CJK SC, sans-serif" font-size="47" font-weight="400" text-anchor="start" fill="#7f776d">圜丘方向</text><text x="6240" y="10810.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="400" text-anchor="start" fill="#707b76">只示南方参照，不推定坛形</text><text x="4350" y="8890.0" font-family="Noto Sans CJK SC, sans-serif" font-size="49" font-weight="400" text-anchor="start" fill="#6f99a5">洛水</text></g></g><line x1="1708" y1="440" x2="1708" y2="360" stroke="#263f3b" stroke-width="3"/><path d="M1698 378 L1708 360 L1718 378" fill="none" stroke="#263f3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1708" y="342.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#263f3b">北</text><line x1="1815" y1="350" x2="1815" y2="1585" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="365.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#5d6d78">安置关系<tspan font-family="DejaVu Sans"> / </tspan>非对街位置</text><text x="1880" y="470.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#5d6d78">金陵馆</text><line x1="2038" y1="458" x2="2150" y2="458" stroke="#707b76" stroke-width="2" marker-end="url(#arr)"/><text x="2195" y="470.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#917452">归正里</text><text x="2195" y="526.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">三年后赐宅</text><text x="1880" y="638.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#5d6d78">燕然馆</text><line x1="2038" y1="626" x2="2150" y2="626" stroke="#707b76" stroke-width="2" marker-end="url(#arr)"/><text x="2195" y="638.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#917452">归德里</text><text x="2195" y="694.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">三年后赐宅</text><text x="1880" y="806.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#5d6d78">扶桑馆</text><line x1="2038" y1="794" x2="2150" y2="794" stroke="#707b76" stroke-width="2" marker-end="url(#arr)"/><text x="2195" y="806.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#917452">慕化里</text><text x="2195" y="862.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">记赐宅，未记等待年数</text><text x="1880" y="974.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#5d6d78">崦嵫馆</text><line x1="2038" y1="962" x2="2150" y2="962" stroke="#707b76" stroke-width="2" marker-end="url(#arr)"/><text x="2195" y="974.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#917452">慕义里</text><text x="2195" y="1030.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">记赐宅，未记等待年数</text><line x1="1880" y1="1130" x2="2715" y2="1130" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="1195.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#9b7b3d">市场<tspan font-family="DejaVu Sans"> / </tspan>主图外附记</text><g transform="translate(1945 1300) scale(0.65)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#9b7b3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#9b7b3d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#9b7b3d">市</text></g><text x="2035" y="1293.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" text-anchor="start" fill="#9b7b3d">四通市＝永桥市</text><text x="2035" y="1352.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">只知洛水南；御道路侧、距桥距离未定。</text><text x="1880" y="1485.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#9b7b3d">鱼鳖市：归正里内巷市</text><text x="1880" y="1540.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#707b76">与四通市分开登记，不因同卖鱼而合并。</text><line x1="85" y1="1638" x2="905" y2="1638" stroke="#917452" stroke-width="3"/><text x="85" y="1688.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#917452">里内所属</text><text x="85" y="1735.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">归正里：萧正德宅后改归正寺，改寺时点未定；宅、市落位未记。慕义里：菩</text><text x="85" y="1771.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">提寺建寺年代与里内落位未明。</text><line x1="985" y1="1638" x2="1805" y2="1638" stroke="#5d6d78" stroke-width="3"/><text x="985" y="1688.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#5d6d78">萧宝夤迁居</text><text x="985" y="1735.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">归正里旧宅<tspan font-family="DejaVu Sans"> </tspan>→<tspan font-family="DejaVu Sans"> </tspan>城内永安里宅。迁居关系在时间说明中表达，不把后宅留在洛</text><text x="985" y="1771.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">南。</text><line x1="1885" y1="1638" x2="2705" y2="1638" stroke="#7f776d" stroke-width="3"/><text x="1885" y="1688.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#7f776d">二坊与华表</text><text x="1885" y="1735.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">道东白象、狮子二坊另列时相；两岸有华表不等于总数恰为二，主图不画确定</text><text x="1885" y="1771.0" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#263f3b">数量。</text><line x1="85" y1="1833" x2="2715" y2="1833" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">依据：周本卷二景宁条、卷三永桥及四夷馆里条。逐条行码见<tspan font-family="DejaVu Sans"> s06-constraints.json</tspan>。</text><text x="2715" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">05 / 06 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>研究样板</text></svg>