<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="292.5mm" viewBox="0 0 2800 1950" role="img"><title>景明寺：道路位置与构成目录</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#707b76" stroke-width="1.3"/></marker></defs><rect x="0" y="0" width="2800" height="1950" fill="#faf9f5"/><text x="85" y="79.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="500" text-anchor="start" fill="#356f62">历史研究项目<tspan font-family="DejaVu Sans"> / </tspan>北魏洛阳<tspan font-family="DejaVu Sans"> / v2.4 </tspan>首批应用样板</text><text x="85" y="174.0" font-family="Noto Serif CJK SC, serif" font-size="57" font-weight="500" text-anchor="start" fill="#263f3b"><tspan font-family="DejaVu Serif">D07  </tspan>景明寺：位置明确到关系，构成保留在旁注</text><text x="85" y="246.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#707b76">新增寺级专页；原<tspan font-family="DejaVu Sans"> D05 </tspan>景明—台学范围保留。三池、水功设施与塔不再占任意院内坐标。</text><line x1="85" y1="286" x2="2715" y2="286" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="356.0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="500" text-anchor="start" fill="#5d6d78">宣阳门—景明—永桥<tspan font-family="DejaVu Sans"> / </tspan>母图专题裁切</text><rect x="210.6761565836299" y="398.0" width="1428.6476868327402" height="1295.0" fill="#ffffff" stroke="#d5d8cf" stroke-width="2"/><defs><clipPath id="mapcrop"><rect x="210.6761565836299" y="398.0" width="1428.6476868327402" height="1295.0"/></clipPath></defs><g clip-path="url(#mapcrop)"><g transform="translate(-2208.8078291814945 -2556.0747330960853) scale(0.4608540925266904)"><path d="M4400 6800 L7800 6800" fill="none" stroke="#b2b7af" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="25 16"/><path d="M6100 6800 L6100 8920" fill="none" stroke="#d4c8ae" stroke-width="71" stroke-linejoin="round" stroke-linecap="round"/><path d="M6100 6800 L6100 8920" fill="none" stroke="#ffffff" stroke-width="65" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 8970 L2300 9010 L4200 8940 L6100 9000 L8000 8970 L9800 9050 L11700 8960" fill="none" stroke="#e0edf0" stroke-width="130" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 8970 L2300 9010 L4200 8940 L6100 9000 L8000 8970 L9800 9050 L11700 8960" fill="none" stroke="#6f99a5" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="20 14"/><rect x="6062" y="8860" width="76" height="280" fill="#ffffff" stroke="#5d6d78" stroke-width="4"/><line x1="6062" y1="8890" x2="6138" y2="8890" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="8945" x2="6138" y2="8945" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9000" x2="6138" y2="9000" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9055" x2="6138" y2="9055" stroke="#5d6d78" stroke-width="2"/><line x1="6062" y1="9110" x2="6138" y2="9110" stroke="#5d6d78" stroke-width="2"/><text x="6220" y="9010.0" font-family="Noto Sans CJK SC, sans-serif" font-size="48" font-weight="400" text-anchor="start" fill="#5d6d78">永桥<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>浮桥</text><text x="6220" y="9070.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76"><tspan font-family="DejaVu Sans">P167</tspan></text><g transform="translate(6100 6800) scale(0.85)"><line x1="-30" y1="-36" x2="-30" y2="36" stroke="#5d6d78" stroke-width="5"/><line x1="30" y1="-36" x2="30" y2="36" stroke="#5d6d78" stroke-width="5"/><line x1="-46" y1="-36" x2="-14" y2="-36" stroke="#5d6d78" stroke-width="3"/><line x1="14" y1="-36" x2="46" y2="-36" stroke="#5d6d78" stroke-width="3"/></g><text x="6395" y="6800.0" font-family="Noto Sans CJK SC, sans-serif" font-size="47" font-weight="500" text-anchor="middle" fill="#263f3b">宣阳门</text><g transform="translate(6900.0 7620.0) scale(1.3)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#356f62">寺</text></g><text x="6900.0" y="7742.0" font-family="Noto Sans CJK SC, sans-serif" font-size="58" font-weight="500" text-anchor="middle" fill="#356f62">景明寺</text><text x="6900.0" y="7818.56" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#707b76"><tspan font-family="DejaVu Sans">T38</tspan></text><text x="6900" y="7885.0" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="400" text-anchor="middle" fill="#356f62">宣阳门外一里<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>御道东</text><text x="6900" y="7970.0" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#707b76">“方五百步”保留原文，不折算院界</text><text x="6190" y="8200.0" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="400" text-anchor="start" fill="#5d6d78">御道</text><text x="5600" y="8785.0" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400" text-anchor="start" fill="#6f99a5">洛水<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>河形示意</text><text x="5500" y="7050.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#707b76">内城南界示意</text></g></g><line x1="1708" y1="440" x2="1708" y2="360" stroke="#263f3b" stroke-width="3"/><path d="M1698 378 L1708 360 L1718 378" fill="none" stroke="#263f3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1708" y="342.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#263f3b">北</text><line x1="1815" y1="350" x2="1815" y2="1745" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="365.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="500" text-anchor="start" fill="#356f62">寺内构成<tspan font-family="DejaVu Sans"> / </tspan>行序没有方位含义</text><path d="M1905 445 L1885 445 L1885 1450 L1905 1450" fill="none" stroke="#d5d8cf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(1995 545) scale(0.8)"><rect x="-65" y="-26" width="130" height="52" fill="#e1ece5" stroke="#356f62" stroke-width="3"/><line x1="-73" y1="-33" x2="73" y2="-33" stroke="#356f62" stroke-width="2"/><line x1="-73" y1="33" x2="73" y2="33" stroke="#356f62" stroke-width="2"/></g><text x="2110" y="537.0" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="500" text-anchor="start" fill="#356f62">复殿重房</text><text x="2110" y="603.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">浮道相通；栋数与落位未定。</text><g transform="translate(1995 785) scale(0.8)"><path d="M-47 -17 Q-23 -37 0 -17 T47 -17" fill="none" stroke="#6f99a5" stroke-width="3"/><path d="M-47 0 Q-23 -20 0 0 T47 0" fill="none" stroke="#6f99a5" stroke-width="3"/><path d="M-47 17 Q-23 -3 0 17 T47 17" fill="none" stroke="#6f99a5" stroke-width="3"/></g><text x="2110" y="777.0" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="500" text-anchor="start" fill="#6f99a5">池水<tspan font-family="DejaVu Sans"> </tspan>×<tspan font-family="DejaVu Sans"> 3</tspan></text><text x="2110" y="843.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">只表示数量；池形、池位未定。</text><g transform="translate(1995 1025) scale(0.8)"><circle cx="0" cy="0" r="35" fill="#ffffff" stroke="#6f99a5" stroke-width="3"/><text x="0" y="15.0" font-family="Noto Serif CJK SC, serif" font-size="39" font-weight="500" text-anchor="middle" fill="#6f99a5">功</text></g><text x="2110" y="1017.0" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="500" text-anchor="start" fill="#6f99a5">水功设施</text><text x="2110" y="1083.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">碾磑、舂簸；位置和接水未定。</text><g transform="translate(1995 1265) scale(0.8)"><rect x="-41" y="-41" width="82" height="82" fill="#ffffff" stroke="#356f62" stroke-width="3"/><rect x="-27" y="-27" width="54" height="54" fill="#e1ece5" stroke="#356f62" stroke-width="2"/><circle cx="0" cy="0" r="6" fill="#356f62" stroke="#356f62" stroke-width="1"/></g><text x="2110" y="1257.0" font-family="Noto Sans CJK SC, sans-serif" font-size="35" font-weight="500" text-anchor="start" fill="#356f62">七层塔</text><text x="2110" y="1323.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">正光始造；盛时截点前竣工未证。</text><line x1="1880" y1="1495" x2="2715" y2="1495" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="1555.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#263f3b">年代的表达</text><text x="1880" y="1620.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">“始造”不等于一直在建，也不能单独证明在盛时截点前已经竣</text><text x="1880" y="1662.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">工。</text><text x="85" y="1760.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">本页只取主要道路参照；景明南的双女寺、台学及旧迹继续由区域图与原<tspan font-family="DejaVu Sans"> D05 </tspan>表达。</text><line x1="85" y1="1833" x2="2715" y2="1833" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">依据：《洛阳伽蓝记》卷三景明寺条；建筑与水功目录不作为地理图层回贴。</text><text x="2715" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">04 / 06 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>研究样板</text></svg>