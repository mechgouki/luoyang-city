="#5d6d78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#5d6d78">署</text></g><text x="5900" y="4980.0" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="500" text-anchor="middle" fill="#5d6d78">太尉府†</text><text x="5900" y="5036.76" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#707b76"><tspan font-family="DejaVu Sans">P03</tspan></text><g transform="translate(4720.0 5195.0) scale(0.8)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#917452" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#917452" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#917452">里</text></g><text x="4720.0" y="5295.0" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="500" text-anchor="middle" fill="#917452">永康里†</text><text x="4720.0" y="5351.76" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#707b76"><tspan font-family="DejaVu Sans">P26</tspan></text><g transform="translate(6750 4870) scale(0.8)"><path d="M-30 -44 L-57 -44 L-57 44 L-30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 -44 L57 -44 L57 44 L30 44" fill="none" stroke="#356f62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="19.0" font-family="Noto Serif CJK SC, serif" font-size="52" font-weight="500" text-anchor="middle" fill="#356f62">寺</text></g><text x="6750" y="4970.0" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="500" text-anchor="middle" fill="#356f62">景乐寺†</text><text x="6750" y="5026.76" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#707b76"><tspan font-family="DejaVu Sans">T05</tspan></text><text x="6190" y="5680.0" font-family="Noto Sans CJK SC, sans-serif" font-size="46" font-weight="400" text-anchor="start" fill="#5d6d78">御道</text><text x="4690" y="5810.0" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" fill="#707b76">只示四邻与相对关系</text><text x="4690" y="5870.0" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#707b76">其他官署、宅第在本专题省略</text></g></g><line x1="1708" y1="440" x2="1708" y2="360" stroke="#263f3b" stroke-width="3"/><path d="M1698 378 L1708 360 L1718 378" fill="none" stroke="#263f3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1708" y="342.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="500" text-anchor="middle" fill="#263f3b">北</text><line x1="1815" y1="350" x2="1815" y2="1745" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="365.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" font-weight="500" text-anchor="start" fill="#356f62">院内关系<tspan font-family="DejaVu Sans"> / </tspan>独立示意</text><g transform="translate(2310 580) scale(1.42)"><rect x="-65" y="-26" width="130" height="52" fill="#e1ece5" stroke="#356f62" stroke-width="3"/><line x1="-73" y1="-33" x2="73" y2="-33" stroke="#356f62" stroke-width="2"/><line x1="-73" y1="33" x2="73" y2="33" stroke="#356f62" stroke-width="2"/></g><text x="2310" y="680.0" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle" fill="#356f62">佛殿</text><text x="2310" y="736.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#707b76">在塔北；东西对齐不作证据</text><g transform="translate(2310 918) scale(1.45)"><rect x="-41" y="-41" width="82" height="82" fill="#ffffff" stroke="#356f62" stroke-width="3"/><rect x="-27" y="-27" width="54" height="54" fill="#e1ece5" stroke="#356f62" stroke-width="2"/><circle cx="0" cy="0" r="6" fill="#356f62" stroke="#356f62" stroke-width="1"/></g><text x="2310" y="1034.0" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="500" text-anchor="middle" fill="#356f62">木塔<tspan font-family="DejaVu Sans"> </tspan>·<tspan font-family="DejaVu Sans"> </tspan>九层</text><line x1="1960" y1="968" x2="1960" y2="555" stroke="#707b76" stroke-width="2" marker-end="url(#arr)"/><text x="1960" y="514.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#707b76">北</text><line x1="1880" y1="1105" x2="2715" y2="1105" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="1163.0" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" text-anchor="start" fill="#356f62">门制目录</text><text x="1880" y="1230.0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b">北门：一道，无屋</text><text x="1880" y="1290.0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b">南门：楼三重</text><text x="1880" y="1350.0" font-family="Noto Sans CJK SC, sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#263f3b">东西门：楼两重</text><text x="1880" y="1410.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#707b76">三阁道：单列校读，不画三个门洞</text><line x1="1880" y1="1464" x2="2715" y2="1464" stroke="#d5d8cf" stroke-width="2"/><text x="1880" y="1526.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">僧房楼观“千余间”仅记规模，不分配成四块对称房舍。</text><text x="1880" y="1645.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#263f3b">院墙有记；具体墙形、门距、开间和塔殿间距仍未定。</text><text x="85" y="1760.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#707b76">†<tspan font-family="DejaVu Sans"> </tspan>太尉府路侧、永康里及景乐部分关系沿既有解释；本轮只调整表示方法。</text><line x1="85" y1="1833" x2="2715" y2="1833" stroke="#d5d8cf" stroke-width="2"/><text x="85" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#707b76">依据：《洛阳伽蓝记》卷一永宁寺条；原文、周校释及范校注分层阅读。</text><text x="2715" y="1886.0" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="end" fill="#707b76"><tspan font-family="DejaVu Sans">03 / 06 </tspan>·<tspan font-family="DejaVu Sans"> </tspan>研究样板</text></svg>