<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">鸿池陂：古湖低地的位置与留存尺度</title>
  <desc id="desc">1983年勘探在偃师商城东南角外发现古湖低地。两条按相同比例绘制的长度线，分别表示梁克敏转述的东西1480米与北半部南北半径约800米。南半部被冲毁，图中没有绘制岸线。</desc>
  <rect width="960" height="540" fill="#f9f6ee"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#2b3735">
    <text x="42" y="53" font-size="31" font-weight="bold">鸿池陂的遗存尺度</text>
    <text x="42" y="92" font-size="20">偃师商城东南角外的古湖低地，见于 1983 年勘探。</text>
    <path d="M42 118H918" stroke="#aab5ae"/>
    <text x="42" y="155" font-size="20" font-weight="bold">两项勘探尺度</text>
    <text x="42" y="182" font-size="16" fill="#4a5c58">梁克敏转述偃师市文物部门的勘探结果。两条线采用同一米尺，仅作长度比较。</text>
    <text x="42" y="235" font-size="20">东西范围</text>
    <text x="42" y="309" font-size="20">北半部南北半径</text>
    <g fill="none" stroke="#287062" stroke-linecap="butt">
      <path d="M265 229h444M265 218v22m444 -22v22" stroke-width="3"/>
      <path d="M265 303h240M265 292v22m240 -22v22" stroke-width="3"/>
    </g>
    <text x="723" y="236" font-size="22" font-weight="bold">1480 米</text>
    <text x="520" y="310" font-size="22" font-weight="bold">约 800 米</text>
    <g stroke="#54706a" fill="none" stroke-width="1.5"><path d="M265 366h150M265 359v12m150 -12v12"/></g>
    <text x="265" y="393" font-size="15" fill="#4a5c58" text-anchor="middle">0</text><text x="415" y="393" font-size="15" fill="#4a5c58" text-anchor="middle">500 米</text>
    <path d="M42 416H918" stroke="#aab5ae"/>
    <text x="42" y="452" font-size="19" font-weight="bold">南半部已被洛水冲毁，516—528 年的岸线仍待核定。</text>
    <text x="42" y="484" font-size="16" fill="#4a5c58">资料据曹慧奇、谷飞、陈国梁（2021）图一及梁克敏（2022）第一节。</text>
    <text x="42" y="509" font-size="16" fill="#4a5c58">图中未画湖岸、南岸端点或古水深。</text>
  </g>
</svg>
