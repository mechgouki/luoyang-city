<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 709" role="img"><title>千秋门 · 哪些位置可以核对</title><desc>两种图像分别判读　｜　宫城概图的米尺只用于该图，发掘区图保留像素</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft Yahei",sans-serif;fill:#29382f} .heading{font-size:32px;font-weight:700} .sub{font-size:16px;fill:#59655d} .h{font-size:20px;font-weight:700} .b{font-size:17px} .v{font-size:16px;font-weight:700} .fine{font-size:14px;fill:#515e53} .rule{stroke:#cecab9;stroke-width:1}</style>
<rect width="980" height="709" fill="#faf7ee"/><text class="heading" x="38" y="54">千秋门 · 哪些位置可以核对</text><text class="sub" x="40" y="88">两种图像分别判读　｜　宫城概图的米尺只用于该图，发掘区图保留像素</text><text x="40" y="136" class="h" text-anchor="start">图 69 的宫城尺度</text><text x="40" y="167" class="fine" text-anchor="start">奈文研原图的 200 米标尺长 95 像素。下图按原标尺等比例表达两图符的间距。</text><line x1="110" y1="220" x2="768.4526315762" y2="220" stroke="#35675b" stroke-width="3" stroke-dasharray="" /><circle cx="110" cy="220" r="6" fill="#35675b"/><circle cx="768.4526315762" cy="220" r="6" fill="#35675b"/><text x="110" y="203" class="v" text-anchor="middle">千秋门 · 北</text><text x="768.4526315762" y="203" class="v" text-anchor="middle">西南隅调查区 · 南</text><text x="432" y="251" class="h" text-anchor="middle">图符中心约 0.76 千米</text><line x1="110.0" y1="273" x2="110.0" y2="281" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="110.0" y="302" class="fine" text-anchor="middle">0 m</text><line x1="284.0" y1="273" x2="284.0" y2="281" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="284.0" y="302" class="fine" text-anchor="middle">200 m</text><line x1="458.0" y1="273" x2="458.0" y2="281" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="458.0" y="302" class="fine" text-anchor="middle">400 m</text><line x1="632.0" y1="273" x2="632.0" y2="281" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="632.0" y="302" class="fine" text-anchor="middle">600 m</text><line x1="806.0" y1="273" x2="806.0" y2="281" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="806.0" y="302" class="fine" text-anchor="middle">800 m</text><line x1="110" y1="273" x2="806.0" y2="273" stroke="#8d9583" stroke-width="1" stroke-dasharray="" /><text x="40" y="336" class="fine" text-anchor="start">图符边缘与尺端取点的敏感度约 0.70–0.82 千米，现场距离与古坐标仍待核。</text><line x1="39" y1="362" x2="939" y2="362" stroke="#c7c8b8" stroke-width="1" stroke-dasharray="" /><text x="40" y="401" class="h" text-anchor="start">千秋门 · 航拍标注图内的相对位置</text><text x="40" y="432" class="fine" text-anchor="start">1000 × 960 像素的原图由北向箭头定向，第 590 像素行依次穿过三条有标注的魏晋水道。</text><circle cx="201" cy="483" r="7" fill="#678692"/><text x="201" y="468" class="v" text-anchor="middle">水道 3</text><text x="201" y="512" class="fine" text-anchor="middle">x = 397 px</text><circle cx="372" cy="483" r="7" fill="#427c86"/><text x="372" y="468" class="v" text-anchor="middle">水道 2</text><text x="372" y="512" class="fine" text-anchor="middle">x = 454 px</text><circle cx="588" cy="483" r="7" fill="#265e63"/><text x="588" y="468" class="v" text-anchor="middle">水道 1</text><text x="588" y="512" class="fine" text-anchor="middle">x = 526 px</text><line x1="122" y1="483" x2="662" y2="483" stroke="#648383" stroke-width="1" stroke-dasharray="" /><text x="94" y="489" class="v" text-anchor="start">西</text><text x="687" y="489" class="v" text-anchor="start">东</text><text x="40" y="554" class="fine" text-anchor="start">点间距为 57、72 像素，仅反映图内顺序。航拍图无可核米尺，未换算现场间距。</text><line x1="39" y1="580" x2="939" y2="580" stroke="#c7c8b8" stroke-width="1" stroke-dasharray="" /><text x="40" y="615" class="b" text-anchor="start">2022 年 6 月公布 3 条；年度成果会上更新为 4 条，合计揭露超过 80 米。</text><text x="40" y="649" class="fine" text-anchor="start">分期照片可辨汉代券砖水道、魏晋水道基槽及北周门址基槽。四条魏晋石渠在 516—528 年的通水情况待核。</text><text x="40" y="680" class="fine" text-anchor="start">来源　今井晃樹《奈文研紀要》2013，图 69；新华社 2022-06-13、2023-01-08（北京日报转载）。</text></svg>