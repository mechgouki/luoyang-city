<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 679" role="img"><title>宫城西墙 · 路下的北魏暗渠</title><desc>西南角以北的横探沟　｜　汉晋明渠、北魏道路及地下涵洞</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft Yahei",sans-serif;fill:#29382f} .heading{font-size:32px;font-weight:700} .sub{font-size:16px;fill:#59655d} .h{font-size:20px;font-weight:700} .b{font-size:17px} .v{font-size:16px;font-weight:700} .fine{font-size:14px;fill:#515e53} .rule{stroke:#cecab9;stroke-width:1}</style>
<rect width="980" height="679" fill="#faf7ee"/><text class="heading" x="38" y="54">宫城西墙 · 路下的北魏暗渠</text><text class="sub" x="40" y="88">西南角以北的横探沟　｜　汉晋明渠、北魏道路及地下涵洞</text><text x="40" y="139" class="h" text-anchor="start">同一探沟内的横向尺寸</text><text x="40" y="166" class="fine" text-anchor="start">每格5米，各列分别从零量起。地层上下关系另见右下说明。</text><line x1="254" y1="212" x2="254" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="254" y="199" class="fine" text-anchor="middle">0m</text><line x1="344" y1="212" x2="344" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="344" y="199" class="fine" text-anchor="middle">5</text><line x1="434" y1="212" x2="434" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="434" y="199" class="fine" text-anchor="middle">10</text><line x1="524" y1="212" x2="524" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="524" y="199" class="fine" text-anchor="middle">15</text><line x1="614" y1="212" x2="614" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="614" y="199" class="fine" text-anchor="middle">20</text><line x1="704" y1="212" x2="704" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="704" y="199" class="fine" text-anchor="middle">25</text><line x1="794" y1="212" x2="794" y2="424" stroke="#ddd9cb" stroke-width="1" stroke-dasharray="" /><text x="794" y="199" class="fine" text-anchor="middle">30</text><text x="40" y="236" class="b" text-anchor="start">汉晋明渠 · 上口</text><line x1="254" y1="231" x2="776" y2="231" stroke="#427c86" stroke-width="12" stroke-dasharray="" /><text x="787" y="236" class="v" text-anchor="start">29 m</text><text x="40" y="279" class="b" text-anchor="start">汉晋明渠 · 渠底</text><line x1="254" y1="274" x2="621.2" y2="274" stroke="#65949b" stroke-width="12" stroke-dasharray="" /><text x="632.2" y="279" class="v" text-anchor="start">20.4 m</text><text x="40" y="322" class="b" text-anchor="start">北魏路面 · 现存</text><line x1="254" y1="317" x2="452" y2="317" stroke="#a0875d" stroke-width="12" stroke-dasharray="" /><line x1="452" y1="317" x2="524" y2="317" stroke="#a0875d" stroke-width="11" stroke-dasharray="4 4" /><text x="535" y="322" class="v" text-anchor="start">11–15 m</text><text x="40" y="365" class="b" text-anchor="start">北魏暗渠 · 基槽上口</text><line x1="254" y1="360" x2="322.4" y2="360" stroke="#6d8270" stroke-width="12" stroke-dasharray="" /><text x="333.4" y="365" class="v" text-anchor="start">3.8 m</text><text x="40" y="408" class="b" text-anchor="start">北魏暗渠 · 涵洞净宽</text><line x1="254" y1="403" x2="279.2" y2="403" stroke="#295f50" stroke-width="12" stroke-dasharray="" /><text x="290.2" y="408" class="v" text-anchor="start">1.4 m</text><line x1="39" y1="444" x2="939" y2="444" stroke="#c7c8b8" stroke-width="1" stroke-dasharray="" /><text x="40" y="483" class="h" text-anchor="start">墙与水道的局部关系</text><text x="40" y="516" class="b" text-anchor="start">早期明渠东岸距魏晋宫墙包砖拆除沟 4.2 米。</text><text x="40" y="547" class="b" text-anchor="start">北魏筑墙切入旧渠淤积。墙西 2.7 米的北魏路面下有砖砌暗渠，水向南流。</text><text x="40" y="579" class="fine" text-anchor="start">涵洞净高约 1.3 米，施工基槽底宽 3.5 米。路面保留宽度只适用于揭露处。</text><text x="40" y="618" class="fine" text-anchor="start">依据　钱国祥（2012），第 30 页 §4。探沟位于宫城西南角以北约 80 米，东西长 70 米、南北宽 4 米。</text><text x="40" y="646" class="fine" text-anchor="start">奈文研（2013）第 53 页另述西南角主区沟 4，距墙 7 米、涵洞高 1.5 米。两处量值各按原报告列示。</text></svg>