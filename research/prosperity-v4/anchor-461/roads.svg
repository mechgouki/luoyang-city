<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="title desc" xml:lang="zh-CN"><title id="title">内城南部横道与白马寺坊南路口</title><desc id="desc">左表对照内城大道在1973与2020年的报道尺度，中图逐段复现申遗图Lh-1断开线形，下图按同一米尺比较白马寺坊路、南侧缺口及密集车辙带的宽度。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif}.num{font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1000" height="750" fill="#f9f7ef" /><text x="38" y="49" font-size="32" fill="#263730" font-weight="700">两处道路的尺寸与位置依据</text><text x="38" y="83" font-size="19" fill="#263730" font-weight="normal">内城南部的东西大道与外郭西部白马寺里坊分别核读。</text><line x1="38" y1="103" x2="962" y2="103" stroke="#d5d8cf" stroke-width="1" /><text x="38" y="139" font-size="26" fill="#244e44" font-weight="700">西明门至青阳门</text><text x="38" y="178" font-size="17" fill="#696e63" font-weight="600">资料</text><text x="424" y="178" font-size="17" fill="#696e63" font-weight="600">道路长度</text><text x="654" y="178" font-size="17" fill="#696e63" font-weight="600">道路宽度</text><line x1="38" y1="188" x2="962" y2="188" stroke="#d5d8cf" stroke-width="1" /><text x="38" y="222" font-size="20" fill="#263730" font-weight="normal">1973年勘查 · 横一道</text><text x="424" y="222" font-size="20" fill="#263730" font-weight="normal">约 2,460 米</text><text x="654" y="222" font-size="20" fill="#263730" font-weight="normal">约 29–36 米</text><text x="38" y="260" font-size="20" fill="#263730" font-weight="normal">2020年报道 · 大道概数</text><text x="424" y="260" font-size="20" fill="#263730" font-weight="normal">约 2,500 米</text><text x="654" y="260" font-size="20" fill="#263730" font-weight="normal">约 34 米</text><text x="38" y="296" font-size="17" fill="#263730" font-weight="normal">1988年图6据1973年勘查，图尺0至1公里。2020年在多个解剖点发掘。</text><line x1="38" y1="318" x2="962" y2="318" stroke="#d5d8cf" stroke-width="1" /><text x="38" y="354" font-size="24" fill="#244e44" font-weight="700">申遗管理图 06a · 城南横道 Lh-1</text><text x="38" y="386" font-size="17" fill="#263730" font-weight="normal">下图按同一横、纵比例重绘原图三段线条，在原有断点处留白。</text><polyline points="80.0000,419.0000 95.3783,420.1854" stroke="#256555" stroke-width="5" fill="none" stroke-linecap="butt" /><polyline points="110.8567,421.2126 216.0152,421.3305 300.2847,421.3353 384.5570,421.2574 468.8311,421.1348 553.1061,421.0056 637.3811,420.9076 721.6551,420.8788 805.9273,420.9574 890.1968,421.1812 894.6086,421.2519" stroke="#256555" stroke-width="5" fill="none" stroke-linecap="butt" /><polyline points="902.3668,421.3729 915.0131,421.5691 917.7841,421.6242" stroke="#256555" stroke-width="5" fill="none" stroke-linecap="butt" /><text x="38" y="451" font-size="17" fill="#263730" font-weight="normal">按P1图面坐标估算，三段分别约49、2,472、49米，已绘合计约2.57公里。</text><text x="38" y="479" font-size="17" fill="#263730" font-weight="normal">断点间距约49和24米。这些数值只描述图上画线；与发掘测线的对应仍待核。</text><line x1="38" y1="503" x2="962" y2="503" stroke="#d5d8cf" stroke-width="1" /><text x="38" y="541" font-size="24" fill="#244e44" font-weight="700">白马寺坊南 · 各项宽度（米）</text><text x="38" y="572" font-size="17" fill="#263730" font-weight="normal">2024年的坊内中央纵街与2025年的南部路口各有测量，图中按同一米尺比较。</text><text x="38" y="613" font-size="18" fill="#263730" font-weight="normal">2024 · 坊内中央纵街</text><rect x="422" y="597" width="396" height="12" rx="1" fill="#497c69" /><text x="831" y="613" font-size="17" fill="#263730" font-weight="normal">约 22</text><text x="38" y="655" font-size="18" fill="#263730" font-weight="normal">2025 · 大道北侧坊门缺口</text><rect x="422" y="639" width="135.0" height="12" rx="1" fill="#96693f" /><text x="570.0" y="655" font-size="17" fill="#263730" font-weight="normal">约 7.5</text><text x="38" y="697" font-size="18" fill="#263730" font-weight="normal">2025 · 坊内纵街密集车辙带</text><rect x="422" y="681" width="82.8" height="12" rx="1" fill="#a77d57" /><text x="517.8" y="697" font-size="17" fill="#263730" font-weight="normal">约 4.6</text><text x="38" y="733" font-size="16" fill="#64685d" font-weight="normal">西阳门外大道与坊路的交会已见于发掘。此次所核资料尚未给出交会处大道的完整路宽。</text></svg>