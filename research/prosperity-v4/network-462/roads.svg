<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" role="img" aria-labelledby="t d" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><title id="t">北魏洛阳内城八条道路和十二组交接关系</title><desc id="d">沿用申遗图06a道路折线。11处图线相交，宫城阊阖门前的横二与铜驼街交会有文字记录，原图在此处留有断笔。右栏将断笔放大。</desc><rect x="0" y="0" width="1180" height="880" fill="#fbfaf5" stroke="none" /><text x="39" y="55" font-size="36" fill="#253e34" font-weight="700" text-anchor="start">北魏洛阳内城的八条路在哪里交会</text><text x="40" y="89" font-size="19" fill="#536960" font-weight="normal" text-anchor="start">据《汉魏洛阳城初步勘查》辨认道路，以申遗图 06a 的原有线条核对位置。</text><line x1="40" x2="1140" y1="109" y2="109" stroke="#c9ccbf" stroke-width="1" /><text x="40" y="145" font-size="22" fill="#253e34" font-weight="700" text-anchor="start">内城道路与交会</text><text x="640" y="159" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">北 ↑</text><polyline points="255.848,283.373 255.537,288.890" stroke="#b9bdb1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="0" /><polyline points="254.889,300.483 252.598,341.425 251.807,364.578 251.698,374.767 250.922,439.158 249.995,480.367" stroke="#b9bdb1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="1" /><polyline points="249.864,486.173 249.740,491.697 255.264,491.779" stroke="#b9bdb1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="2" /><polyline points="267.029,491.964 272.283,492.047 304.829,493.453 331.701,494.124" stroke="#b9bdb1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="3" /><polyline points="337.581,494.273 343.105,494.411 343.518,488.899" stroke="#b9bdb1" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="4" /><polyline points="344.305,478.450 344.732,472.747 346.102,451.517 347.193,430.306 348.080,409.106 348.837,387.914 349.540,366.722 350.264,345.526 351.082,324.32