bpath="1" /><polyline points="190.983,719.077 190.841,726.442" stroke="#236b61" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="2" /><circle cx="444.25834625" cy="705.16097625" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="393.90868624999996" cy="705.1558724999999" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="268.758575" cy="705.32113125" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="191.25093875000005" cy="705.3607649999999" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="454.03119874999993" cy="504.5753850000001" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="404.3868499999999" cy="502.59765000000004" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="275.0446250000001" cy="498.52355624999996" r="10" fill="none" stroke="#ac4d38" stroke-width="1.6" /><circle cx="188.4613475" cy="496.1724937500001" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="460.0141250000001" cy="381.219105" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="410.8457225" cy="378.4622100000001" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="190.98715624999988" cy="374.75608124999997" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><circle cx="193.2187925000001" cy="273.39460500000007" r="4.1" fill="#344940" stroke="#fbfaf5" stroke-width="1" /><text x="107.5" y="272.8749999999999" font-size="15" fill="#536960" font-weight="normal" text-anchor="end" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">横四  承明门</text><text x="107.5" y="375.62500000000006" font-size="15" fill="#536960" font-weight="normal" text-anchor="end" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">横三  阊阖门</text><text x="107.5" y="497.6875000000001" font-size="15" fill="#536960" font-weight="normal" text-anchor="end" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">横二  西阳门</text><text x="107.5" y="708.25" font-size="15" fill="#536960" font-weight="normal" text-anchor="end" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">横一  西明门</text><text x="566.125" y="390.24999999999994" font-size="15" fill="#536960" font-weight="normal" text-anchor="start" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">建春门</text><text x="550.0" y="512.125" font-size="15" fill="#536960" font-weight="normal" text-anchor="start" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">东阳门</text><text x="528.4749999999999" y="709.4875" font-size="15" fill="#536960" font-weight="normal" text-anchor="start" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">青阳门</text><text x="190.85000000000002" y="746.45" font-size="15" fill="#536960" font-weight="normal" text-anchor="middle" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">纵四</text><text x="267.8750000000001" y="759.9625000000001" font-size="15" fill="#536960" font-weight="normal" text-anchor="middle" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">纵三</text><text x="393.76250000000005" y="728.8125" font-size="15" fill="#536960" font-weight="normal" text-anchor="middle" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">纵二</text><text x="442.8125" y="768.2375" font-size="15" fill="#536960" font-weight="normal" text-anchor="middle" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">纵一</text><text x="413.8749999999999" y="178.75" font-size="15" fill="#536960" font-weight="normal" text-anchor="start" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">广莫门</text><text x="284.0" y="551.0" font-size="15" fill="#536960" font-weight="normal" text-anchor="start" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">铜驼街</text><text x="270.0" y="438.0" font-size="15" fill="#536960" font-weight="normal" text-anchor="middle" paint-order="stroke" stroke="#fbfaf5" stroke-width="5" stroke-linejoin="round">宫城</text><text x="40" y="802" font-size="16" fill="#253e34" font-weight="normal" text-anchor="start">●  图面线条相交</text><text x="247" y="802" font-size="16" fill="#ac4d38" font-weight="normal" text-anchor="start">○  文字记交会，原图断笔</text><text x="40" y="833" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">阊阖门有两处。横三西端是内城西垣城门，铜驼街北端是宫城正门。</text><text x="40" y="858" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">本图采用来源图版面位置。线宽、符号和文字大小均不表示遗迹实际宽度。</text><line x1="709" x2="709" y1="132" y2="774" stroke="#d2d4ca" stroke-width="1" /><text x="735" y="150" font-size="23" fill="#253e34" font-weight="700" text-anchor="start">阊阖门前的交会</text><text x="735" y="181" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">横二由西阳门通东阳门，在宫城南侧</text><text x="735" y="208" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">与铜驼街呈丁字交会，图线在此留白。</text><rect x="738" y="229" width="395" height="156" fill="#f2f0e7" stroke="none" /><defs><clipPath id="inset"><rect x="742" y="233" width="387" height="148" fill="white" stroke="none" /></clipPath></defs><g clip-path="url(#inset)"><polyline points="3349.341,390.458 3282.633,387.398" stroke="#ac4d38" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="0" /><polyline points="3215.642,384.531 2552.778,357.910 2251.880,345.503 1950.938,334.352 1649.961,324.242 1348.957,314.955 1047.934,306.275 746.900,297.986 445.863,289.872 144.830,281.716 -368.434,262.336" stroke="#ac4d38" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="1" /><polyline points="-401.934,261.051 -468.676,258.535" stroke="#ac4d38" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="2" /><polyline points="932.294,199.044 930.255,265.820" stroke="#236b61" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="0" /><polyline points="928.122,334.878 921.084,563.563 902.180,1212.894 880.590,1853.658 866.854,2372.634" stroke="#236b61" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="1" /><polyline points="865.927,2407.162 864.158,2473.938" stroke="#236b61" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="butt" fill="none" data-subpath="2" /></g><text x="747" y="257" font-size="13" fill="#536960" font-weight="normal" text-anchor="start">原线局部放大</text><text x="1081" y="297" font-size="14" fill="#994836" font-weight="normal" text-anchor="start">横二</text><text x="945" y="372" font-size="14" fill="#236b61" font-weight="normal" text-anchor="start">纵三</text><text x="735" y="416" font-size="16" fill="#536960" font-weight="normal" text-anchor="start">两路原线最近相距约 0.938 个 PDF 版面点。</text><text x="735" y="442" font-size="16" fill="#536960" font-weight="normal" text-anchor="start">断笔在图上，不能据此认定古路中断。</text><line x1="735" x2="1135" y1="467" y2="467" stroke="#d2d4ca" stroke-width="1" /><text x="735" y="506" font-size="22" fill="#253e34" font-weight="700" text-anchor="start">西阳门内的发掘剖面</text><text x="735" y="541" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">2013 年，在西城墙内侧约 35 米处，</text><text x="735" y="570" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">发掘见上下两层路面，均有东西向车辙。</text><text x="735" y="599" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">下层推属北魏。南侧疑路沟残宽约 6 米，</text><text x="735" y="628" font-size="17" fill="#536960" font-weight="normal" text-anchor="start">北侧约 4 米，与北门道下砖沟的连接待核。</text><line x1="735" x2="1135" y1="650" y2="650" stroke="#d2d4ca" stroke-width="1" /><text x="735" y="681" font-size="16" fill="#253e34" font-weight="700" text-anchor="start">资料年代与位置</text><text x="735" y="707" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">1973 年报告第 202–203 页，曹陽图 6。</text><text x="735" y="731" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">折线出自申遗图 06a。宫前路口据钱国祥</text><text x="735" y="755" font-size="15" fill="#536960" font-weight="normal" text-anchor="start">《华夏考古》2019 年第 4 期，第 81 页。</text></svg>