<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 575" role="img" aria-labelledby="title desc"><title id="title">东、西外郭三处门址的四个宽度</title><desc id="desc">东郭第二门靠墙路土宽18米、阙口位置路土宽8米。西郭第一门和第三门阙口约30米、40米。横条共用比例尺。</desc><rect width="920" height="575" fill="#faf8f2" /><g font-family="Noto Sans CJK SC, Source Han Sans CN, sans-serif"><text x="38" y="57" font-size="37" fill="#26362e" font-weight="700">路到郭门有多宽？</text><text x="40" y="94" font-size="20" fill="#26362e" font-weight="400">地方勘查转述记录的三处门址，四个宽度使用同一米尺。</text><text x="40" y="150" font-size="23" fill="#24645f" font-weight="700">东郭北起第二门</text><text x="375" y="150" font-size="18" fill="#26362e" font-weight="400">后张村东、白村北</text><text x="56" y="199" font-size="19" fill="#26362e" font-weight="400">靠城墙的路土</text><rect x="302" y="182" width="180" height="14" fill="#387c77" /><text x="494" y="197" font-size="18" fill="#26362e" font-weight="400">18 米</text><text x="56" y="243" font-size="19" fill="#26362e" font-weight="400">阙口处的路土</text><rect x="302" y="226" width="80" height="14" fill="#387c77" /><text x="394" y="241" font-size="18" fill="#26362e" font-weight="400">8 米</text><line x1="40" y1="273" x2="870" y2="273" stroke="#cbc8bb" stroke-width="1" /><text x="40" y="315" font-size="23" fill="#78552e" font-weight="700">西郭南起第一门、第三门</text><text x="56" y="363" font-size="19" fill="#26362e" font-weight="400">第一门　阙口</text><rect x="302" y="347" width="300" height="14" fill="#9c794d" /><text x="614" y="362" font-size="18" fill="#26362e" font-weight="400">约 30 米</text><text x="56" y="408" font-size="19" fill="#26362e" font-weight="400">第三门　阙口</text><rect x="302" y="392" width="400" height="14" fill="#9c794d" /><text x="714" y="407" font-size="18" fill="#26362e" font-weight="400">约 40 米</text><line x1="302" y1="454" x2="702" y2="454" stroke="#47554c" stroke-width="1.3" /><line x1="302" y1="450" x2="302" y2="461" stroke="#47554c" stroke-width="1" /><text x="296" y="486" font-size="15" fill="#26362e" font-weight="400">0</text><line x1="402" y1="450" x2="402" y2="461" stroke="#47554c" stroke-width="1" /><text x="396" y="486" font-size="15" fill="#26362e" font-weight="400">10</text><line x1="502" y1="450" x2="502" y2="461" stroke="#47554c" stroke-width="1" /><text x="496" y="486" font-size="15" fill="#26362e" font-weight="400">20</text><line x1="602" y1="450" x2="602" y2="461" stroke="#47554c" stroke-width="1" /><text x="596" y="486" font-size="15" fill="#26362e" font-weight="400">30</text><line x1="702" y1="450" x2="702" y2="461" stroke="#47554c" stroke-width="1" /><text x="696" y="486" font-size="15" fill="#26362e" font-weight="400">40</text><text x="741" y="484" font-size="16" fill="#26362e" font-weight="400">米</text><text x="40" y="531" font-size="18" fill="#26362e" font-weight="400">西郭记录量的是两侧门阙之间的开口。街道全程宽度仍待逐段勘探资料。</text><text x="40" y="558" font-size="15" fill="#62675d" font-weight="400">资料：《文化瀍河》第二章第五节外郭城门段。</text></g></svg>