<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl des" viewBox="0 0 800 705"><title id="ttl">城南古洛水与两条门外道路</title><desc id="des">左图概括2023年报告图一的永桥、西大郊、灵台与今古洛河相对位置。右侧并排阅读北魏永桥过河和东汉引洛渠与津阳门外路的关系。图无地理坐标。</desc><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#223e45}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#415e63}.h{font-size:20px;font-weight:700}.t{font-size:16px}.small{font-size:13px;fill:#526a6c}.source{font-size:13px;fill:#4f6466}.teal{fill:#196c70}.rust{fill:#9a4d35}.water{fill:none;stroke:#397c85;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}</style><rect width="800" height="705" rx="14" fill="#fbfaf6"/><text x="28" y="49" class="title">城南古洛水与两条门外道路</text><text x="29" y="79" class="sub">永桥的过河地点，与津阳门外引洛渠的方位，来自两种不同的记录。</text><path d="M28 96L772 96" stroke="#cfdbd7" stroke-width="1" fill="none" /><text x="28" y="127" class="h">永桥与西大郊</text><text x="453" y="127" class="h">两条门外道路</text><rect x="25" y="139" width="391" height="390" rx="10" fill="#edf1e9"/><polyline points="33.8,193.7 276.5,192.6 391.9,192.6" class="water" style="stroke:#819799;stroke-dasharray:4 5;stroke-width:1.8"/><polyline points="33.8,211.3 215.8,213.5 391.9,211.3" class="water" style="stroke:#819799;stroke-dasharray:4 5;stroke-width:1.8"/><polyline points="32.6,450.0 101.6,430.2 129.0,414.8 211.1,381.8 294.4,348.8 328.9,305.9 343.2,275.1 358.6,261.9 391.9,255.3" class="water" /><polyline points="32.6,499.5 102.8,484.1 125.4,478.6 187.3,467.6 237.2,451.1 294.4,436.8 334.8,446.7" class="water" /><path d="M89.69 151V194.8H169.42L177.75 151" fill="none" stroke="#687369" stroke-width="2.7"/><text x="105" y="177" class="small">故城</text><text x="270" y="181" class="small">今洛河</text><circle cx="86.12" cy="261.9" r="4.5" fill="#426968"/><text x="97.12" y="268.9" class="t">灵台</text><circle cx="117.06" cy="393.9" r="4.5" fill="#426968"/><text x="129.06" y="387.9" class="t">西大郊</text><circle cx="306.27" cy="310.3" r="4.5" fill="#426968"/><text x="248.26999999999998" y="298.3" class="t">西罗凹</text><path d="M109.3 424.3L109.3 480.3" stroke="#a75d42" stroke-width="3" fill="none" /><path d="M115.3 424.3L115.3 480.3" stroke="#a75d42" stroke-width="3" fill="none" /><text x="126.3" y="498.3" class="t">永桥（图示）</text><text x="202" y="432" class="teal">古洛河</text><text x="282" y="506" class="small">北 ↑　无比例尺</text><path d="M432 141L432 529" stroke="#d4dfd8" stroke-width="1" fill="none" /><text x="453" y="165" class="h">宣阳门外的浮桥</text><text x="453" y="196" class="small">北魏《洛阳伽蓝记》卷三</text><text x="453" y="226" class="t">出宣阳门四里至洛水，水上架有永桥。</text><text x="453" y="254" class="t">桥南到圜丘之间，御道东有四夷馆，</text><text x="453" y="281" class="t">道西有四夷里。</text><path d="M453 303L765 303" stroke="#d1dbd5" stroke-width="1" fill="none" /><text x="453" y="339" class="h">津阳门外的引洛渠</text><text x="453" y="369" class="small">2022年调查报告第8页，追述东汉工程</text><text x="453" y="400" class="t">渠在门外大街东侧，靠佃庄、河头村东。</text><text x="453" y="429" class="t">向南接古洛河，向北抵城南阳渠，</text><text x="453" y="458" class="t">北端在今龙虎滩村南一带。</text><text x="453" y="499" class="small">路渠间距、桥头和渠口坐标均待核。</text><path d="M28 549L772 549" stroke="#cfdbd7" stroke-width="1" fill="none" /><text x="28" y="582" class="h">怎样读这张图</text><text x="28" y="611" class="sub">左图取自2023年含嘉仓报告第2页图一的局部关系。原图综合多个时代，河岸为作者示意。</text><text x="28" y="639" class="sub">同页图二据《水经注》摹绘，洛水枝在东周王城以西；引洛渠见另一本报告的城南材料。</text><text x="28" y="680" class="source">来源　洛阳市文物考古研究院编，两部发掘报告（2022、2023）；杨衒之《洛阳伽蓝记》卷三。</text></svg>