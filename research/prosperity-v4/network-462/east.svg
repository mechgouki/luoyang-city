<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 878" role="img" aria-labelledby="title description">
<title id="title">外郭东墙至鸿池陂及池东古渠</title>
<desc id="description">从上到下依次排列向东追踪的地名。池西从外郭东墙经诸村至商城，通常宽60至80米。池东可追至东屯村东山嘴南，向东的古入洛口仍不明。各节点间隔不表示实距。</desc>
<style>
  text { font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#243d38 }
  .heading {font-size:31px;font-weight:650}
  .sub {font-size:16px;fill:#50706a}
  .group {font-size:19px;font-weight:650;fill:#24594f}
  .place {font-size:21px;font-weight:600}
  .detail {font-size:16px;fill:#435953}
  .badge {font-size:15px;fill:#4d645e}
  .phase {font-size:17px;fill:#664f37}
  .notehead {font-size:17px;font-weight:650;fill:#4c4434}
</style>
<rect width="800" height="878" fill="#fbfaf4"/>
<path d="M30 95H770M30 682H770" stroke="#cdcfc2"/>
<text x="32" y="49" class="heading">东阳渠如何穿过偃师</text>
<text x="34" y="78" class="sub">按由西向东的次序读图。节点间距不表示实地距离。</text>
<rect x="29" y="114" width="189" height="245" rx="5" fill="#e6eee5"/>
<text x="45" y="152" class="group">东郭以外 · 池西段</text>
<text x="45" y="198" class="detail">梁克敏转述的</text>
<text x="45" y="224" class="detail">通常渠宽</text>
<text x="45" y="264" style="font-size:26px;font-weight:650;fill:#24594f">60–80米</text>
<text x="45" y="307" class="badge">沿途以村、路和</text>
<text x="45" y="331" class="badge">商城遗址定位。</text>
<rect x="29" y="379" width="189" height="68" rx="5" fill="#dcebf1"/>
<text x="45" y="420" class="group">两段分界 · 鸿池陂</text>
<rect x="29" y="464" width="189" height="194" rx="5" fill="#eee9dd"/>
<text x="45" y="502" class="group">池东段</text>
<text x="45" y="542" class="detail">旧渠较池西窄。</text>
<text x="45" y="568" class="detail">调查材料给出的</text>
<text x="45" y="594" class="detail">年代仅到汉魏。</text>
<path d="M253 135V360M253 439V646" fill="none" stroke="#548276" stroke-width="3"/>
<g fill="#fbfaf4" stroke="#548276" stroke-width="3">
<circle cx="253" cy="135" r="6"/><circle cx="253" cy="207" r="6"/><circle cx="253" cy="278" r="6"/><circle cx="253" cy="349" r="6"/>
<circle cx="253" cy="486" r="6"/><circle cx="253" cy="556" r="6"/>
</g>
<path d="M253 358v30m0 45v9" stroke="#548276" stroke-width="3"/>
<path d="M253 392l14 17-14 17-14-17z" fill="#70939e" stroke="#466e7c" stroke-width="2"/>
<text x="281" y="142" class="place">北魏外郭东墙</text>
<text x="281" y="168" class="detail">渠道穿墙处约在今陇海铁路以北100米。</text>
<text x="281" y="214" class="place">羊二庄、南蔡庄、大冢头</text>
<text x="281" y="240" class="detail">向东经过三村北侧。</text>
<text x="281" y="285" class="place">前杜楼、华夏西路</text>
<text x="281" y="311" class="detail">过前杜楼村南，沿今华夏西路北侧再向东。</text>
<text x="281" y="356" class="place">偃师商城</text>
<text x="281" y="382" class="detail">穿过商城中南部，转向东南入陂。</text>
<text x="281" y="417" class="place">鸿池陂</text>
<text x="281" y="443" class="detail">北魏自洛阳至陂的水路有文献依据。</text>
<text x="281" y="493" class="place">洛神路、商都东路、老城村北</text>
<text x="281" y="519" class="detail">前两处是现代道路参照，具体交点待核。</text>
<text x="281" y="563" class="place">汤泉村东南</text>
<text x="281" y="589" class="detail">在这一带与今中州渠大致重合。</text>
<path d="M244 646h18" stroke="#795e43" stroke-width="5"/>
<text x="281" y="637" class="place">东屯村东山嘴南</text>
<text x="281" y="663" class="detail">可追踪的渠迹到此为止，再东受洛河泛滥破坏。</text>
<text x="34" y="718" class="notehead">池东在北魏还能通船吗？</text>
<text x="34" y="749" class="phase">梁克敏复原的水运网向东接洛。黄学超区分水流与舟运，认为</text>
<text x="34" y="776" class="phase">北魏仍可通水，但池东旧运渠已废。古入洛口的位置尚待证实。</text>
<path d="M30 800H770" stroke="#cdcfc2"/>
<text x="34" y="828" class="badge">资料　2011年勘察简报，20–25页；黄学超（2026）转引其中22–23页。</text>
<text x="34" y="852" class="badge">村路参照与测宽另核梁克敏（2022）。此图据文字整理，未绘测量中心线。</text>
</svg>
