<g font-size="17" fill="#394c42">
<text x="68" y="187">城门</text><text x="217" y="157">环城谷水</text>
<text x="200" y="332">东西御道</text><text x="222" y="429">阳渠（推定）</text>
<text x="79" y="534">崇义里东</text><text x="226" y="600">七里涧</text>
</g>
<g font-size="26" font-weight="bold">
<text x="365" y="166">建春门石桥</text><text x="365" y="340">东石桥｜马市石桥比定</text><text x="365" y="518">七里桥｜旅人桥比定</text>
</g>
<g font-size="20">
<text x="365" y="204">出城过环城谷水。石柱铭系于东汉阳嘉四年（135）。</text>
<text x="365" y="238">《伽蓝记》记孝昌三年（527）大雨，桥体受损。</text>
<text x="365" y="377">离建春门一里余，南北通行，桥北大道两侧有里坊。</text>
<text x="365" y="411">黄学超将桥置于东西御道以南，跨其复原的阳渠。</text>
<text x="365" y="445">《伽蓝记》记晋太康元年（280）。</text>
<text x="365" y="554">过桥东行一里至开三道的郭门。两书所记工程年有异。</text>
<text x="365" y="589">《晋书》记274年立桥；《水经注》引书记282年十一月“初就功”。</text>
</g>
<text x="40" y="676" font-size="19">棕线为街道，青线为水道，青虚线为学者推定的局部渠位。三图均未地理配准。</text>
<text x="40" y="716" font-size="17" fill="#586657">《洛阳伽蓝记》卷二 ·《水经注》卷十六 ·《晋书》卷三 · 黄学超（2026）第三节及图4</text>
</g></svg>
