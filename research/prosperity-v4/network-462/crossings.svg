<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="bc-title bc-desc">
<title id="bc-title">建春门外的三座桥</title><desc id="bc-desc">独立局部关系图。东西向建春门石桥跨环城谷水，南北向东石桥跨阳渠为黄氏复原，东行至七里桥过七里涧。距离和水线未按比例。</desc>
<rect width="1080" height="760" fill="#faf8f1"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#263c34">
<text x="40" y="58" font-size="34" font-weight="bold">建春门外的三座桥</text>
<text x="40" y="94" font-size="20">每格展示一处局部关系。图上方为北，格间无比例。</text>
<path d="M40 119H1040 M40 291H1040 M40 474H1040 M40 636H1040" fill="none" stroke="#c4caba" stroke-width="2"/>
<g fill="none" stroke-linecap="round">
<path d="M197 141 V264" stroke="#458389" stroke-width="10"/>
<path d="M65 205 H330" stroke="#ac7247" stroke-width="8"/>
<path d="M169 194 H225 M169 216 H225" stroke="#3c4b41" stroke-width="4"/>
<path d="M65 344 H329 M177 316 V450" stroke="#ac7247" stroke-width="8"/>
<path d="M69 396 H330" stroke="#458389" stroke-width="8" stroke-dasharray="12 9"/>
<path d="M166 374 V418 M188 374 V418" stroke="#3c4b41" stroke-width="5"/>
<path d="M213 497 Q228 531 195 567 T178 612" stroke="#458389" stroke-width="10"/>
<path d="M65 552 H327" stroke="#ac7247" stroke-width="8"/>
