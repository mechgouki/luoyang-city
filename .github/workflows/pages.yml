name: Validate and deploy Luoyang Atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luoyang-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble and verify unchanged baseline PDF
        run: python tools/assemble_pdf.py
      - name: Check baseline data and interactions
        run: |
          python tools/validate_site.py
          node --check app.js
          node --test tests/map-interactions.test.cjs
          node --check research.js
      - name: Build baseline plus reproducible R07 supplement
        run: |
          python tools/build_site.py
          python tools/research_v25.py
      - name: Install browser acceptance tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance under the project subpath
        run: python tests/browser_v25.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-build-evidence
          path: artifacts/browser
          retention-days: 14
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check actual HTTPS resources and hashes
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tools/verify_live.py --base-url "$SITE_URL" --commit "$GITHUB_SHA"
      - name: Install live browser tests
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise the deployed desktop and mobile website
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: python tests/browser_v25.py --base-url "$SITE_URL" --output artifacts/live-browser
      - name: Preserve live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-evidence
          path: artifacts
          retention-days: 30
