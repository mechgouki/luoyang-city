  <path d="M86 266 L86 237 M79 247 L86 237 L93 247" fill="none" stroke="#263c34" stroke-width="2" />
  <text x="1076" y="216" font-size="23" fill="#263c34" class="strong">三组读图，可同框</text>
  <text x="1076" y="254" font-size="18" fill="#60716a">北路与承明门西短线来自P465；</text>
  <text x="1076" y="283" font-size="18" fill="#60716a">南路、河带与桥符来自P466；东</text>
  <text x="1076" y="312" font-size="18" fill="#60716a">西门端来自P462。</text>
  <text x="1076" y="369" font-size="22" fill="#263c34" class="strong">保留原图像素</text>
  <text x="1076" y="405" font-size="18" fill="#60716a">三组均取同一1145×951嵌入图。</text>
  <text x="1076" y="434" font-size="18" fill="#60716a">图尺92像素＝原图1公里，不是新</text>
  <text x="1076" y="463" font-size="18" fill="#60716a">增地面量测。</text>
  <text x="1076" y="520" font-size="22" fill="#263c34" class="strong">图上仍不知道</text>
  <text x="1076" y="556" font-size="18" fill="#60716a">承明门以西最后实测点、北路终</text>
  <text x="1076" y="585" font-size="18" fill="#60716a">点与合流点、永桥桥头，以及可</text>
  <text x="1076" y="614" font-size="18" fill="#60716a">归入516—528年的古岸段。</text>
  <text x="1076" y="671" font-size="22" fill="#427b87" class="strong">没有跨图配准</text>
  <text x="1076" y="707" font-size="18" fill="#60716a">本图与左册06a各自独立。古洛水</text>
  <text x="1076" y="736" font-size="18" fill="#60716a">图带没有投到06a，也没有换成现</text>
  <text x="1076" y="765" font-size="18" fill="#60716a">代经纬度。</text>
  <line x1="48" y1="1027" x2="1392" y2="1027" stroke="#d8dcd0" stroke-width="2" />
  <text x="48" y="1061" font-size="18" fill="#60716a">图源：钱国祥《汉魏洛阳城城门与宫院门的考察研究》2018图一；朱岩石2024印页17图6转载。</text>
  <text x="48" y="1093" font-size="18" fill="#60716a">摘绘线端为现有读图范围；古洛水为学者复原图的图带，永桥为制图符号，均非新确定的北魏地面位置。</text>
  <text x="48" y="1125" font-size="18" fill="#60716a">北魏盛时相关证据逐条另列；辟雍180米引水干道未接入此图，其516—528年通水情况仍待证。</text>
</svg>