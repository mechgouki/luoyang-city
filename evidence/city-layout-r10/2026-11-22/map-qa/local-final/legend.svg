<svg xmlns="http://www.w3.org/2000/svg" id="city-layout-legend" viewBox="0 0 1680 1188" width="1680" height="1188" role="img" lang="zh-CN" font-family="Noto Sans CJK SC, sans-serif" aria-labelledby="city-layout-legend-title city-layout-legend-description" data-original-viewbox="0 0 1680 1188" data-pdf-pages="1" data-source-frames-registered-together="false" data-new-geographic-coordinates="0" data-new-shoreline-geometries="0" data-coordinate-space="independent-source-and-reading-frames"><title id="city-layout-legend-title">图例、证据与尚未完成的空间</title><desc id="city-layout-legend-description">本图集完成既定材料的分区表达；完整历史复原仍取决于同层测线、共同控制、可靠时相与原图。</desc><rect x="0" y="0" width="1680" height="1188" fill="#f3f5ef" stroke="none" stroke-width="1.2" rx="0" /><text x="40" y="43" font-size="19" fill="#245f4c" font-weight="600">盛时洛阳  /  R10 城市布局图集</text><text x="40" y="91" font-size="37" fill="#203a34" font-weight="700">图例、证据与尚未完成的空间</text><text x="40" y="127" font-size="20" fill="#687571">本图集完成既定材料的分区表达；完整历史复原仍取决于同层测线、共同控制、可靠时相与原图。</text><text x="40" y="1165" font-size="16" fill="#687571">516 至 528 年综合研究窗口  ·  来源位置、相对关系与艺术复原分别阅读</text><text x="1640" y="1165" font-size="16" fill="#245f4c" text-anchor="end">全城总览</text><rect x="40" y="182" width="385" height="216" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="10" /><path d="M60 217 L135 217" fill="none" stroke="#245f4c" stroke-width="5" /><text x="60" y="260" font-size="25" fill="#245f4c" font-weight="700">来源图依据</text><text x="60" y="294" font-size="20" fill="#687571">来源框内保留原段与缺口；关系窗绿色</text><text x="60" y="323" font-size="20" fill="#687571">仅指来源身份，位置仍是非比例排版。</text><rect x="445" y="182" width="385" height="216" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="10" /><path d="M465 217 L540 217" fill="none" stroke="#966b39" stroke-width="5" /><text x="465" y="260" font-size="25" fill="#966b39" font-weight="700">文献／报告关系</text><text x="465" y="294" font-size="20" fill="#687571">棕色方向与归属按明确证据表达。只有</text><text x="465" y="323" font-size="20" fill="#687571">标出的关系构成判断，间距没有古代米</text><text x="465" y="352" font-size="20" fill="#687571">制意义。</text><rect x="850" y="182" width="385" height="216" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="10" /><path d="M870 217 L945 217" fill="none" stroke="#4a6f91" stroke-width="5" stroke-dasharray="8 5" /><text x="870" y="260" font-size="25" fill="#4a6f91" font-weight="700">条件解释</text><text x="870" y="294" font-size="20" fill="#687571">蓝色虚线表示需要条件的读法或身份解</text><text x="870" y="323" font-size="20" fill="#687571">释。不同方案分别阅读，不拼为同时成</text><text x="870" y="352" font-size="20" fill="#687571">立的布局。</text><rect x="1255" y="182" width="385" height="216" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="10" /><path d="M1275 217 L1350 217" fill="none" stroke="#687571" stroke-width="5" stroke-dasharray="8 5" /><circle cx="1275" cy="217" r="6" fill="#fffefa" stroke="#687571" stroke-width="2" /><circle cx="1350" cy="217" r="6" fill="#fffefa" stroke="#687571" stroke-width="2" /><text x="1275" y="260" font-size="25" fill="#687571" font-weight="700">仍待定位</text><text x="1275" y="294" font-size="20" fill="#687571">灰色与空心端点保留接口、端点及位置</text><text x="1275" y="323" font-size="20" fill="#687571">未知。留白不证明古代不存在，也不由</text><text x="1275" y="352" font-size="20" fill="#687571">全景补齐。</text><text x="42" y="445" font-size="25" fill="#245f4c" font-weight="700">几种图面表达，各自回答不同的问题</text><text x="60" y="484" font-size="21" fill="#203a34">方位窗：箭线只标关系，不表示路段；间距与线宽不按比例，不由未连接节点或方向传递补出判断。</text><text x="60" y="524" font-size="21" fill="#203a34">归属窗：表示无序成员集合；框线只分阅读组，不是里墙、院墙或市场边界，排列不表示街序。</text><text x="60" y="564" font-size="21" fill="#203a34">次序窗与对照窗：解释营建、沿革、仪式或版本关系，不把时间先后画成城市道路。</text><text x="42" y="632" font-size="25" fill="#245f4c" font-weight="700">六类尚缺资料决定完整复原的边界</text><rect x="40" y="657" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="58" y="691" font-size="23" fill="#245f4c" font-weight="600">1  宣阳门与内城南墙</text><text x="58" y="727" font-size="20" fill="#687571">缺同期门墙联测，现有残段不补成闭合南界。</text><rect x="580" y="657" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="598" y="691" font-size="23" fill="#245f4c" font-weight="600">2  宫城北缘与完整金墉</text><text x="598" y="727" font-size="20" fill="#687571">候选填色不作北墙，丙城局部不代替三城范围。</text><rect x="1120" y="657" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="1138" y="691" font-size="23" fill="#245f4c" font-weight="600">3  连续道路与桥头接口</text><text x="1138" y="727" font-size="20" fill="#687571">末测点、门端、跨水处及各期路缘仍需逐段核对。</text><rect x="40" y="802" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="58" y="836" font-size="23" fill="#245f4c" font-weight="600">4  洛水古岸与渠池岸线</text><text x="58" y="872" font-size="20" fill="#687571">现代河线和研究图河段不能替代目标期实测古岸。</text><rect x="580" y="802" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="598" y="836" font-size="23" fill="#245f4c" font-weight="600">5  六世纪古地面</text><text x="598" y="872" font-size="20" fill="#687571">现代高程与遗存残高不当作北魏地面或建筑原高。</text><rect x="1120" y="802" width="520" height="126" fill="#fffefa" stroke="#ccd7cd" stroke-width="1.2" rx="9" /><text x="1138" y="836" font-size="23" fill="#245f4c" font-weight="600">6  跨图共同定位</text><text x="1138" y="872" font-size="20" fill="#687571">来源框独立；共同测点、基准转换与误差尚待核验。</text><text x="42" y="988" font-size="23" fill="#245f4c" font-weight="600">回查路径：11 区图  /  96 项判断  /  原文与图页定位  /  完整 JSON、CSV 与离线包</text><text x="42" y="1025" font-size="20" fill="#687571">每张片区图的判断编号可回到正式网页。图中引用旧实体、道路和水系 ID，不把记录数量等同独立古址或道路数量。</text><text x="42" y="1091" font-size="20" fill="#245f4c">https://mechgouki.github.io/luoyang-city/luoyang-city-layout.html</text><text x="42" y="1125" font-size="17" fill="#687571">来源提交：1a988bc51adc74288ec8a8aa682499444007a33c</text></svg>