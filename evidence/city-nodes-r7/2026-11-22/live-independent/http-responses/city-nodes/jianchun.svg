<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" width="1200" height="1320" role="img" aria-labelledby="r7-jianchun-title r7-jianchun-desc" lang="zh-CN" font-family="Noto Sans CJK SC, sans-serif" data-plate="r7-jianchun" data-new-geographic-coordinates="0"><title id="r7-jianchun-title">建春门三桥 · 道路方向、水道解释与527年</title><desc id="r7-jianchun-desc">516—528 年｜三桥独立登记；关系图无比例，桥头、古岸与道路交点均不由图上排版补定</desc><rect width="1200" height="1320" fill="#f6f3e9" /><text x="40" y="49" font-size="29" fill="#263f36" font-weight="700">建春门三桥 · 道路方向、水道解释与527年</text><text x="40" y="82" font-size="16" fill="#526457">516—528 年｜三桥独立登记；关系图无比例，桥头、古岸与道路交点均不由图上排版补定</text><text x="40" y="125" font-size="21" fill="#263f36" font-weight="700">① 三桥先分清：不是同一条东西直线上的三个测点</text><rect x="40" y="151" width="360" height="335" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-B01" data-segment-ref="B01"><text x="60" y="187" font-size="22" fill="#315f4e" font-weight="700">建春石桥  B01</text></a><g data-diagram="documentary-bridge-relationship" data-bridge-record="B01"><text x="60" y="230" font-size="19" fill="#263f36">建春门外石桥</text><text x="60" y="264" font-size="19" fill="#263f36">明悬尼寺在桥南</text><text x="60" y="298" font-size="19" fill="#263f36">135年铭归此桥</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-JC02"><rect x="60" y="328" width="320" height="91" fill="#f3e7d6" stroke="#d3ae83" rx="8" /><text x="77" y="358" font-size="21" fill="#8b512e" font-weight="700">527年：大雨受损</text><text x="77" y="389" font-size="17" fill="#8b512e">528年前是否修复：未知</text></a><text x="60" y="458" font-size="17" fill="#59695d">事件不传递给右侧两桥。</text></g><rect x="420" y="151" width="360" height="335" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-B02" data-segment-ref="B02"><text x="440" y="187" font-size="22" fill="#315f4e" font-weight="700">东石桥  B02</text></a><g data-diagram="documentary-bridge-relationship" data-bridge-record="B02"><text x="440" y="221" font-size="18" fill="#315f4e">明确南北通行 · 280年营造记载</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-T10" data-segment-ref="T10"><line x1="600" y1="246" x2="600" y2="281" stroke="#916331" stroke-width="6" data-diagram="bridge-north-road-direction" /><circle cx="600" cy="246" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><text x="619" y="264" font-size="16" fill="#315f4e">北大道 T10</text></a><text x="444" y="291" font-size="16" fill="#263f36">建阳里（西）</text><text x="642" y="291" font-size="16" fill="#263f36">绥民里（东）</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-B02" data-segment-ref="B02"><line x1="587" y1="300" x2="587" y2="341" stroke="#315f4e" stroke-width="3" /><line x1="613" y1="300" x2="613" y2="341" stroke="#315f4e" stroke-width="3" /><line x1="588" y1="304" x2="612" y2="304" stroke="#315f4e" stroke-width="2" /><line x1="588" y1="319" x2="612" y2="319" stroke="#315f4e" stroke-width="2" /><line x1="588" y1="334" x2="612" y2="334" stroke="#315f4e" stroke-width="2" /></a><text x="440" y="332" font-size="17" fill="#315f4e">桥向 ↑↓</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-T22" data-segment-ref="T22"><line x1="600" y1="357" x2="600" y2="391" stroke="#916331" stroke-width="6" /><circle cx="600" cy="391" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><text x="619" y="381" font-size="16" fill="#315f4e">南道 T22</text></a><text x="440" y="427" font-size="17" fill="#263f36">跨桥连续路面、御道路口未测定。</text><text x="440" y="455" font-size="17" fill="#263f36">马市石桥为候选比定。</text></g><rect x="800" y="151" width="360" height="335" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-B03" data-segment-ref="B03"><text x="820" y="187" font-size="22" fill="#315f4e" font-weight="700">七里桥  B03</text></a><g data-diagram="documentary-bridge-relationship" data-bridge-record="B03"><text x="820" y="230" font-size="17" fill="#263f36">崇义里东有桥；桥东一里至郭门</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-B03" data-segment-ref="B03"><text x="820" y="289" font-size="20" fill="#315f4e">七里桥</text></a><line x1="904" y1="282" x2="1058" y2="282" stroke="#315f4e" stroke-width="2" data-diagram="relationship-not-geographic" /><polyline points="1050.0170456949863,286.15601257987333 1058,282 1050.0170456949863,277.84398742012667" stroke="#315f4e" stroke-width="2" fill="none" /><text x="978" y="267" font-size="17" fill="#315f4e" text-anchor="middle">东一里</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-G10" data-segment-ref="G10"><text x="1066" y="283" font-size="18" fill="#315f4e">三门</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-G10" data-segment-ref="G10"><text x="1066" y="307" font-size="16" fill="#315f4e">G10</text></a><text x="820" y="350" font-size="17" fill="#263f36">桥名“七里”不从建春门起量。</text><text x="820" y="380" font-size="17" fill="#263f36">旅人桥为候选比定。</text><text x="820" y="410" font-size="17" fill="#263f36">274／282年两说并存，</text><text x="820" y="440" font-size="17" fill="#263f36">不擅分为始建与重修。</text></g><text x="40" y="531" font-size="21" fill="#263f36" font-weight="700">② 水在路北／路南：遗迹记录与分期解释分别看</text><rect x="40" y="554" width="550" height="234" fill="#eef2ec" stroke="#d4d8c9" rx="8" /><rect x="610" y="554" width="550" height="234" fill="#f3ede2" stroke="#d4d8c9" rx="8" /><text x="60" y="590" font-size="21" fill="#427a8b" font-weight="700">路北宽渠 · 既有调查记录</text><text x="630" y="590" font-size="21" fill="#916331" font-weight="700">路南阳渠 · 黄氏分期复原</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#water-W06"><line x1="71" y1="630" x2="552" y2="630" stroke="#427a8b" stroke-width="4" stroke-dasharray="4 6" data-water-ref="W06" data-diagram="relative-side-only" /><text x="82" y="621" font-size="17" fill="#427a8b">北侧渠迹（不是本轮实测线）</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-O07" data-segment-ref="O07"><line x1="71" y1="689" x2="552" y2="689" stroke="#916331" stroke-width="4" data-diagram="relative-side-only" /><text x="82" y="716" font-size="18" fill="#315f4e">O07 建春门外调查道路</text></a><text x="60" y="759" font-size="17" fill="#59695d">宽年代遗迹，北魏各段分期仍待原孔位。</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-T09" data-segment-ref="T09"><line x1="641" y1="627" x2="1122" y2="627" stroke="#916331" stroke-width="4" data-diagram="relative-side-only" /><text x="652" y="618" font-size="18" fill="#315f4e">T09 建春门外文献御道</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#water-W06"><line x1="641" y1="688" x2="1122" y2="688" stroke="#427a8b" stroke-width="3" stroke-dasharray="9 7" data-water-ref="W06" data-diagram="interpretation-not-bank" /><text x="652" y="718" font-size="17" fill="#427a8b">南侧假说：解释西晋至北魏的桥渠关系</text></a><text x="630" y="759" font-size="17" fill="#59695d">两框无比例，不合成两条同期实测河岸。</text><text x="40" y="833" font-size="21" fill="#263f36" font-weight="700">③ 门下暗渠与七里涧：两个仍须保留的分歧</text><rect x="40" y="856" width="360" height="319" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="60" y="890" font-size="20" fill="#263f36" font-weight="700">门符与局部图不能强配准</text><rect x="60" y="912" width="110" height="100" fill="#fffdf7" stroke="#d4d8c9" rx="0" /><defs><clipPath id="r7-jianchun-native-crop"><rect x="61" y="913" width="108" height="98" /></clipPath></defs><g clip-path="url(#r7-jianchun-native-crop)"><g transform="translate(-2408.3333333333335 -1014.6666666666667) scale(6.666666666666667)" data-frame="frame-06a" data-city-registration="false"><a href="https://mechgouki.github.io/luoyang-city/prosperity-city-atlas.html#feature-geo-jianchun-gate" data-feature="geo-jianchun-gate"><title>内城建春门位置参考；东汉至北魏</title><circle cx="378.463791" cy="296.44101" r="0.6" fill="#fffefa" stroke="#246252" stroke-width="0.315" data-native-geometry="geo-jianchun-gate" /></a></g></g><text x="74" y="932" font-size="15" fill="#263f36">北 ↑</text><text x="188" y="940" font-size="16" fill="#263f36">06a建春门图符</text><text x="188" y="967" font-size="16" fill="#263f36">只有概化位置</text><text x="188" y="994" font-size="16" fill="#263f36">不含实测桥头</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-JC07"><text x="60" y="1044" font-size="17" fill="#263f36">门下暗渠属汉晋下层。</text><text x="60" y="1074" font-size="17" fill="#263f36">516—528继续通流未证；</text><text x="60" y="1104" font-size="17" fill="#263f36">不画通往W06的接线。</text><text x="60" y="1134" font-size="17" fill="#263f36">共同控制点：0。</text></a><rect x="420" y="856" width="740" height="193" fill="#edf2ee" stroke="#d4d8c9" rx="8" /><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-JC06"><text x="440" y="890" font-size="21" fill="#427a8b" font-weight="700">七里涧 · 两种有署名的读法</text><text x="440" y="923" font-size="18" fill="#315f4e" font-weight="600">北来支流：黄学超援杨萧杨校读</text><text x="440" y="950" font-size="17" fill="#263f36">在马市桥后接七里涧段；从北来，南入阳渠。</text><text x="440" y="984" font-size="18" fill="#916331" font-weight="600">传本文序：熊会贞按语</text><text x="440" y="1011" font-size="17" fill="#263f36">解释为城北、东侧水的下流异名；池后合流仍属解释。</text></a><rect x="420" y="1066" width="740" height="109" fill="#f3ecd9" stroke="#dac8a5" rx="8" /><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-T26" data-segment-ref="T26"><text x="440" y="1097" font-size="20" fill="#916331" font-weight="700">T26 乐里道：句中转向的是水</text><text x="440" y="1127" font-size="17" fill="#263f36">“其水……屈而东出阳渠”不提供道路向东拐折的测线。</text><text x="440" y="1154" font-size="17" fill="#263f36">未定汇口、桥头和郭门端点均保留未知。</text></a><text x="40" y="1215" font-size="16" fill="#263f36">来源：周校卷二0099、0106—0107、0111；crossings.json；water-01-collation.json /claims/0—2。</text><text x="40" y="1245" font-size="16" fill="#263f36">局部图：钱2018图二重取复核；门符 geographic-evidence.json /features/20。图像层位沿用原审计。</text><text x="40" y="1275" font-size="16" fill="#263f36">下一件原件：1993《考古》602—608及完整附图，核实测／推定分界、最后探孔和过渠测线。</text></svg>