<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-labelledby="r7-baima-title r7-baima-desc" lang="zh-CN" font-family="Noto Sans CJK SC, sans-serif" data-plate="r7-baima" data-new-geographic-coordinates="0"><title id="r7-baima-title">白马寺南坊门 · 六街、中央十字与门外大道</title><desc id="r7-baima-desc">相对次序图｜图上间距无比例；跨年度发现分别登记，不组成完整同期里坊网格</desc><rect width="1200" height="1010" fill="#f6f3e9" /><text x="40" y="49" font-size="29" fill="#263f36" font-weight="700">白马寺南坊门 · 六街、中央十字与门外大道</text><text x="40" y="82" font-size="16" fill="#526457">相对次序图｜图上间距无比例；跨年度发现分别登记，不组成完整同期里坊网格</text><rect x="40" y="120" width="720" height="700" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="61" y="153" font-size="17" fill="#263f36">北 ↑  坊内</text><text x="420" y="153" font-size="16" fill="#916331">六街登记 ≠ 九处交点均已发掘</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F01" data-segment-ref="F01"><path d="M380 212 L380 401" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="380" cy="212" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="380" cy="401" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F04" data-segment-ref="F04"><path d="M237 309 L545 309" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="237" cy="309" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="545" cy="309" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F02" data-segment-ref="F02"><path d="M155 218 L155 271" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="155" cy="218" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="155" cy="271" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F03" data-segment-ref="F03"><path d="M634 218 L634 271" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="634" cy="218" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="634" cy="271" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F05" data-segment-ref="F05"><path d="M287 188 L458 188" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="287" cy="188" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="458" cy="188" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F06" data-segment-ref="F06"><path d="M287 439 L458 439" fill="none" stroke="#916331" stroke-width="7" stroke-linecap="butt" data-diagram="reported-road-relationship" /><circle cx="287" cy="439" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /><circle cx="458" cy="439" r="5" fill="#fffdf7" stroke="#916331" stroke-width="2" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F05" data-segment-ref="F05"><text x="473" y="194" font-size="16" fill="#315f4e">北横街 F05</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F02" data-segment-ref="F02"><text x="80" y="298" font-size="15" fill="#315f4e">西纵街 F02</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F03" data-segment-ref="F03"><text x="590" y="298" font-size="15" fill="#315f4e">东纵街 F03</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F04" data-segment-ref="F04"><text x="468" y="342" font-size="16" fill="#315f4e">中横街 F04</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F01" data-segment-ref="F01"><text x="400" y="248" font-size="17" fill="#315f4e">居中纵街 F01</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-F06" data-segment-ref="F06"><text x="473" y="445" font-size="16" fill="#315f4e">南横街 F06</text></a><text x="399" y="377" font-size="15" fill="#263f36">报告宽22米；不按图宽量取</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-BA03"><rect x="61" y="347" width="188" height="77" fill="#eef1e6" stroke="#d4d8c9" rx="8" /><text x="76" y="375" font-size="16" fill="#263f36">其余交点未补全</text><text x="76" y="401" font-size="16" fill="#263f36">道路实际端点未知</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-BA07"><rect x="228" y="478" width="355" height="76" fill="#f5eddc" stroke="#c5ac7e" rx="8" /><text x="245" y="506" font-size="16" fill="#785729">中央十字至南坊门：距离未知</text><text x="245" y="532" font-size="16" fill="#785729">尚缺同图测线，图上不补连续街段</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-X02" data-segment-ref="X02"><path d="M380 584 L380 688" fill="none" stroke="#916331" stroke-width="8" /></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-X02" data-segment-ref="X02"><text x="405" y="607" font-size="17" fill="#315f4e">南口交会 X02</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-G11" data-segment-ref="G11"><path d="M345 634 L357 634 L357 659 L345 659" fill="none" stroke="#71816c" stroke-width="2" /><path d="M415 634 L403 634 L403 659 L415 659" fill="none" stroke="#71816c" stroke-width="2" /><text x="441" y="645" font-size="16" fill="#315f4e">大道北缘缺口 G11 · 约7.5米</text><text x="441" y="670" font-size="14" fill="#315f4e">坊门解释；不补墩台、门楼</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-O02" data-segment-ref="O02"><path d="M85 691 L709 691" fill="none" stroke="#916331" stroke-width="8" /><text x="85" y="728" font-size="17" fill="#315f4e">西阳门外大道 O02   → 西阳门方向</text></a><text x="61" y="772" font-size="15" fill="#263f36">X02与门洞处的局部接触有报道；门建筑性质与具体使用层另行核验。</text><rect x="786" y="120" width="374" height="168" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="806" y="154" font-size="21" fill="#263f36" font-weight="700">量值各归其位</text><text x="806" y="185" font-size="17" fill="#263f36">22米：居中纵街宽</text><text x="806" y="211" font-size="17" fill="#263f36">7.5米：南门缺口宽</text><text x="806" y="237" font-size="17" fill="#263f36">4.6米：车辙带宽</text><text x="806" y="263" font-size="17" fill="#263f36">三者不能替代彼此。</text><rect x="786" y="309" width="374" height="149" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="806" y="343" font-size="21" fill="#263f36" font-weight="700">86米与40米</text><text x="806" y="374" font-size="17" fill="#263f36">年度报告的街间距另列。</text><text x="806" y="400" font-size="17" fill="#263f36">测量基线尚未核同；</text><text x="806" y="426" font-size="17" fill="#263f36">不累计成完整坊宽、坊深。</text><rect x="786" y="480" width="374" height="149" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="806" y="514" font-size="21" fill="#263f36" font-weight="700">使用年代</text><text x="806" y="545" font-size="17" fill="#263f36">北魏归属沿用报告。</text><text x="806" y="571" font-size="17" fill="#263f36">六条街道的使用层尚未</text><text x="806" y="597" font-size="17" fill="#263f36">逐一细分至516—528年。</text><rect x="786" y="650" width="374" height="149" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="806" y="684" font-size="21" fill="#263f36" font-weight="700">坊门沟槽与咸池</text><text x="806" y="715" font-size="17" fill="#263f36">沟槽的构造解释待原图。</text><text x="806" y="741" font-size="17" fill="#263f36">W25只供同大道地望联读，</text><text x="806" y="767" font-size="17" fill="#263f36">不画成坊门沟槽的水源。</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#water-W25"><text x="806" y="833" font-size="16" fill="#427a8b">W25 咸池：查看地望依据 →</text></a><text x="40" y="887" font-size="16" fill="#263f36">来源：2024年度里坊发掘纪要；2025年度南坊门纪要；2026年人民日报报道。具体段落与本轮访问情况见核验卡。</text><text x="40" y="919" font-size="16" fill="#263f36">图例：棕线＝已报道的道路关系；圆端＝图上停止，不表示古路止点；明显空白＝接续测线缺失。</text><text x="40" y="951" font-size="16" fill="#263f36">下一份关键原件：坊门、中央十字和两条道路在同一比例尺、同一基准上的发掘平面及分层测线。</text></svg>