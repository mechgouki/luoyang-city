<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-labelledby="r7-sima-title r7-sima-desc" lang="zh-CN" font-family="Noto Sans CJK SC, sans-serif" data-plate="r7-sima" data-new-geographic-coordinates="0"><title id="r7-sima-title">司马门内道路 · 宫院、宫内仓区与宫外仓区</title><desc id="r7-sima-desc">原图像素框与关系示意分开｜三种路宽分别归属于报告对象；不以蓝框推定仓墙</desc><rect width="1200" height="1060" fill="#f6f3e9" /><text x="40" y="49" font-size="29" fill="#263f36" font-weight="700">司马门内道路 · 宫院、宫内仓区与宫外仓区</text><text x="40" y="82" font-size="16" fill="#526457">原图像素框与关系示意分开｜三种路宽分别归属于报告对象；不以蓝框推定仓墙</text><rect x="40" y="122" width="660" height="620" fill="#fffdf7" stroke="#d4d8c9" rx="0" /><text x="60" y="153" font-size="19" fill="#263f36" font-weight="700">2023年公开位置图的可读图元</text><g transform="translate(-90 -282) scale(0.62)" data-frame="frame-sima2023" data-city-registration="false"><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P01" data-segment-ref="P01" data-source-path="research/prosperity-r5/sima-road.json"><path d="M573 900 L575 1050" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/0" data-sima-atomic-line="0" /><path d="M583 900 L585 1050" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/1" data-sima-atomic-line="1" /><path d="M576 1120 L578 1300" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/2" data-sima-atomic-line="2" /><path d="M585 1120 L587 1300" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/3" data-sima-atomic-line="3" /><path d="M579 1332 L579 1448" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/4" data-sima-atomic-line="4" /><path d="M588 1332 L588 1448" fill="none" stroke="#916331" stroke-width="4.838709677419355" data-source-pointer="/image/sima_road_ink_px/5" data-sima-atomic-line="5" /></a><rect x="665" y="779" width="167" height="499" fill="#edf1e6" stroke="#718a96" stroke-width="3.2258064516129035" stroke-dasharray="9 7" data-source-pointer="/image/storage_box_centerline_px" data-role="source-region-box-not-wall" /><circle cx="286" cy="744" r="8.064516129032258" fill="#fff" stroke="#789080" stroke-width="3.2258064516129035" data-source-landmark="千秋门" /><circle cx="430" cy="1396" r="8.064516129032258" fill="#fff" stroke="#789080" stroke-width="3.2258064516129035" data-source-landmark="宫前阊阖门" /><circle cx="424" cy="943" r="8.064516129032258" fill="#fff" stroke="#789080" stroke-width="3.2258064516129035" data-source-landmark="太极殿" /></g><text x="332.3" y="270.98" font-size="16" fill="#427a8b">宫内</text><text x="332.3" y="300.98" font-size="16" fill="#427a8b">仓窖区</text><text x="332.3" y="330.98" font-size="16" fill="#427a8b">范围框</text><text x="332.3" y="360.98" font-size="16" fill="#427a8b">不是墙线</text><text x="101.32" y="185.27999999999997" font-size="16" fill="#263f36">千秋门</text><text x="158.60000000000002" y="568.52" font-size="16" fill="#263f36">宫前阊阖门</text><text x="154.88" y="287.65999999999997" font-size="16" fill="#263f36">太极殿</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P01" data-segment-ref="P01"><text x="230.07999999999998" y="654.06" font-size="17" fill="#315f4e">司马门内路 P01</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-SI08"><text x="485" y="259" font-size="16" fill="#263f36">六根原子线</text><text x="485" y="287" font-size="16" fill="#263f36">逐值沿用</text><text x="485" y="315" font-size="16" fill="#263f36">中间断口不补</text><text x="485" y="343" font-size="16" fill="#263f36" /><text x="485" y="371" font-size="16" fill="#263f36">双线图距不能</text><text x="485" y="399" font-size="16" fill="#263f36">反算实际路宽</text></a><text x="60" y="699" font-size="15" fill="#263f36">原图像素未经本批地理配准；原图蓝框不是新增的实测仓墙。</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P01" data-segment-ref="P01"><rect x="728" y="122" width="432" height="145" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="750" y="158" font-size="21" fill="#315f4e" font-weight="700">约40米 · 司马门内路</text><text x="750" y="195" font-size="18" fill="#263f36">北魏路面最宽处。</text><text x="750" y="225" font-size="18" fill="#263f36">不是两墙之间的已测净距。</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P07" data-segment-ref="P07"><rect x="728" y="285" width="432" height="145" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="750" y="321" font-size="21" fill="#315f4e" font-weight="700">约4.7米 · 宫院夹道</text><text x="750" y="358" font-size="18" fill="#263f36">东北角院落的东围廊与</text><text x="750" y="388" font-size="18" fill="#263f36">宫院东墙之间，属宫院内部。</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P08" data-segment-ref="P08"><rect x="728" y="448" width="432" height="145" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="750" y="484" font-size="21" fill="#315f4e" font-weight="700">约13米 · 仓区内路</text><text x="750" y="521" font-size="18" fill="#263f36">宫内仓区南部的内部道路。</text><text x="750" y="551" font-size="18" fill="#263f36">不等同司马门内路。</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P11" data-segment-ref="P11"><rect x="728" y="611" width="432" height="131" fill="#eef0e4" stroke="#d4d8c9" rx="8" /><text x="750" y="648" font-size="20" fill="#315f4e" font-weight="700">P11 · 宫城东墙外的道路局部</text><text x="750" y="683" font-size="16" fill="#263f36">宫外仓区另列；不接入宫内道路图。</text><text x="750" y="711" font-size="16" fill="#263f36">168口总勘探、13口发掘与3排须核范围。</text></a><text x="40" y="789" font-size="21" fill="#263f36" font-weight="700">空间次序另读：宫院东墙 → 司马门内路 → 宫内仓区西墙</text><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-SI01"><rect x="40" y="811" width="352" height="91" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="58" y="843" font-size="19" fill="#263f36" font-weight="700">宫院东墙</text><text x="58" y="875" font-size="16" fill="#263f36">东北角院落有发掘</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#segment-P01" data-segment-ref="P01"><rect x="424" y="811" width="352" height="91" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="442" y="843" font-size="19" fill="#263f36" font-weight="700">司马门内路 P01</text><text x="442" y="875" font-size="16" fill="#263f36">路面多期叠压</text></a><a href="https://mechgouki.github.io/luoyang-city/luoyang-city-nodes.html#finding-SI01"><rect x="808" y="811" width="352" height="91" fill="#fffdf7" stroke="#d4d8c9" rx="8" /><text x="826" y="843" font-size="19" fill="#263f36" font-weight="700">仓区西墙</text><text x="826" y="875" font-size="16" fill="#263f36">西北角已有识别</text></a><text x="40" y="944" font-size="16" fill="#263f36">三对象的东西关系有据；同一横断面上的墙内缘、路边缘、净距与北魏使用层仍缺共同测线。</text><text x="40" y="975" font-size="16" fill="#263f36">宫外仓窖的统计口径保留各自来源，不据窖数画同期房屋网格。516—528年的逐段同时通行仍待分层核验。</text><text x="40" y="1006" font-size="16" fill="#263f36">来源：2023考古队位置图；2017、2023、2024年度田野汇报；2026新华社与人民日报采访。点图元回查。</text></svg>